function cohort(c){return Array.from({length:25},(_,i)=>{const j=(i*7+3)%25;const high=c===0?j<20:j>=20;const x=high?.70+((j*13+c*7)%31)/100:((j*11+c*3)%31)/100;return {x:Math.round(x*100)/100,choice:winners(x),comparisons:pairChoices(x)};});}

function svgPlot(series,{min=0,max=10,xlabels=['0','0.25','0.5','0.75','1'],xlabel='무게 가중치 x',ylabel='종합점수'}={}){const w=600,h=310,l=55,r=25,t=28,b=48;const px=x=>l+x*(w-l-r),py=y=>h-b-(y-min)/(max-min)*(h-t-b);let s=`<svg viewBox="0 0 ${w} ${h}" role="img" aria-label="${esc(ylabel)} 그래프"><text x="${l}" y="16" class="plotlabel">${esc(ylabel)}</text>`;for(let i=0;i<=4;i++){const v=min+(max-min)*i/4;s+=`<line x1="${l}" y1="${py(v)}" x2="${w-r}" y2="${py(v)}" stroke="#d8deec"/><text x="${l-8}" y="${py(v)+4}" text-anchor="end" class="plotlabel">${Number(v.toFixed(1))}</text>`;}xlabels.forEach((v,i)=>s+=`<text x="${px(i/(xlabels.length-1||1))}" y="${h-26}" text-anchor="middle" class="plotlabel">${v}</text>`);for(const [i,line]of series.entries()){s+=`<polyline fill="none" stroke="${line.color||colors[i%4]}" stroke-width="3" points="${line.values.map((v,j)=>`${px(j/(line.values.length-1||1))},${py(v)}`).join(' ')}"/>`;}return s+`<text x="${w/2}" y="${h-3}" text-anchor="middle" class="plotlabel">${esc(xlabel)}</text></svg>`;}
function tradingPanel(){const i=state.stock,done=false;return `<section class="card"><div class="row between"><h3>${done?'5일간의 투자 완료':`${state.day+1}일차 · 아침 뉴스`}</h3><span class="pill">가상 투자 · 실제 시세 아님</span></div>${done?'<p>거래 기록과 전체 자산을 확인하고, 하루의 결과를 비중으로 설명해 보세요.</p>':`<details><summary>📰 오늘의 뉴스 읽기</summary><ul>${news[state.day].map(t=>`<li>${t}</li>`).join('')}</ul><p class="muted">뉴스는 결과를 보장하지 않습니다. 마감 후 예상 밖의 소식이 있을 수 있습니다.</p></details>`}<div class="stockgrid">${companies.map((c,j)=>`<button class="stock ${i===j?'selected':''}" data-stock="${j}">${String.fromCharCode(65+j)} 기업<small>${c}</small><small>보유 ${state.shares[j]}주</small></button>`).join('')}</div><h4>${String.fromCharCode(65+i)} 기업 거래</h4><p class="muted">종목 가격은 비공개이며, 아래 주문 금액으로 살 수 있는 정수 주식을 계산합니다. 수수료는 없습니다.</p><label for="budget">주문 예산</label> <input id="budget" type="number" min="0" step="100000" value="1000000" style="width:170px"> <span class="muted">원</span><div class="row" style="margin-top:12px"><button data-trade="buy" ${done?'disabled':''}>예산만큼 매수</button><button data-trade="allbuy" class="outline" ${done?'disabled':''}>전액 매수</button><button data-trade="sell" class="outline" ${done?'disabled':''}>보유 전량 매도</button></div><button id="close-day" class="orange" style="margin-top:18px;width:100%" ${done?'disabled':''}>${done?'5일차 마감 완료':'거래를 마치고 오늘 장 마감 →'}</button></section>`;}
function investmentDay(){const latest=Math.min(state.day+1,5);return Number.isInteger(state.reviewDay)&&state.reviewDay>=1&&state.reviewDay<=latest?state.reviewDay:latest;}
function daySteps(selected){return `<div class="day-steps" role="group" aria-label="투자 일차 선택">${Array.from({length:5},(_,i)=>{const day=i+1,complete=day<=state.day,available=complete||day===state.day+1;return `<button data-investment-day="${day}" class="${day===selected?'selected':''}" aria-pressed="${day===selected}" ${available?'':'disabled'}><b>${day}일차</b><small>${complete?'마감 기록':available?'거래하기':'진행 전'}</small></button>`;}).join('')}</div>`;}
function lesson1(){const selected=investmentDay(),h=state.history[selected-1],total=h?h.total:state.cash+state.shares.reduce((a,n,i)=>a+n*state.prices[i],0);return `${daySteps(selected)}<div class="grid"><div class="stack">${h?`<section class="card"><span class="pill">${selected}일차 · 마감 기록</span><h3 style="margin-top:16px">이날 선택한 종목과 투자 결과</h3><p>${h.weights.map((w,i)=>w>0?String.fromCharCode(65+i):null).filter(Boolean).join(' · ')||'매수한 종목 없음 · 현금 보유'}</p><p class="muted">마감 기록을 보고 있습니다. 다음 거래일에서 매수·매도를 계속할 수 있습니다.</p><div class="row">${selected>1?`<button class="outline" data-investment-day="${selected-1}">← ${selected-1}일차</button>`:''}${selected<Math.min(state.day+1,5)?`<button class="orange" data-investment-day="${selected+1}">${selected+1}일차 ${selected<state.day?'기록':'거래하기'} →</button>`:''}</div></section>`:tradingPanel()}<section class="card"><h3>1~5일차 자산 변화</h3>${state.history.length?svgPlot([{values:[100,...state.history.map(h=>h.total/INITIAL*100)],color:'#2f5fe0'}],{min:Math.min(70,...state.history.map(h=>h.total/INITIAL*100))-5,max:Math.max(110,...state.history.map(h=>h.total/INITIAL*100))+5,xlabels:['시작',...state.history.map((_,i)=>`${i+1}일`)],xlabel:'마감 시점',ylabel:'초기 자산 = 100'}):'<p class="muted">첫 장 마감 후 그래프가 나타납니다.</p>'}</section></div><div class="stack"><section class="card hero"><div class="label">${selected}일차 ${h?'마감':'현재'} 총자산</div><div class="metric">${money(total)}</div><p>초기 자금 ${money(INITIAL)} · ${selected}일차까지 누적 수익률 ${pct(total/INITIAL-1)}</p></section><section class="card" id="day-result"><h3>${selected}일차 · 선택 종목과 수익률</h3>${h?dailyResult(h):'<p class="muted">오늘 거래를 마치고 장 마감을 누르면 선택 종목의 수익률과 전체 자산 수익률이 나타납니다.</p>'}</section>${selected===5&&h?`<section class="card" id="investment-reflection"><span class="pill">5일차 · 마무리 질문</span><button id="fill-stock-note" class="outline">예시 답안 채우기</button>${note('stock','내가 선택한 종목들의 하루 수익률의 평균과 전체 자산의 하루 수익률은 왜 다를까?')}</section>`:''}</div></div>`;}
function dailyResult(h){const held=h.rates.map((rate,i)=>({rate,i})).filter(({i})=>h.weights[i]>0),average=held.length?held.reduce((sum,s)=>sum+s.rate,0)/held.length:null;const start=h.day===1?INITIAL:state.history[h.day-2].total;return `<div class="compare day-metrics"><div><div class="label">선택 종목 단순평균</div><div class="metric">${average===null?'—':pct(average)}</div><small>${held.length?held.map(({i})=>String.fromCharCode(65+i)).join(' · '):'보유 종목 없음'}</small></div><div><div class="label">전체 자산 하루 수익률</div><div class="metric">${pct(h.return)}</div><small>하루 손익 ${money(h.total-start)}</small></div></div><div class="scroll"><table><thead><tr><th>선택 종목</th><th>하루 수익률</th><th>투자 비중</th><th>내 손익</th></tr></thead><tbody>${held.map(({rate:r,i})=>`<tr><td>${String.fromCharCode(65+i)}</td><td class="${r>=0?'good':'bad'}">${r>=0?'+':''}${pct(r)}</td><td>${pct(h.weights[i])}</td><td>${money(h.profits[i])}</td></tr>`).join('')}<tr><td>현금</td><td>0.00%</td><td>${pct(h.cashWeight)}</td><td>0원</td></tr><tr class="total-row"><td>전체 자산</td><td>${pct(h.return)}</td><td>100.00%</td><td>${money(h.total-start)}</td></tr></tbody></table></div><p class="muted">${h.day}일차 시작 자산 ${money(start)} → 마감 자산 ${money(h.total)}</p>${h.day===1?'<div class="notice">장 마감 속보 · 수출 제한과 자금 조달 악재로 일부 기업 급락.</div>':''}`;}
function trade(type){if(state.day>=5)return;const i=state.stock,p=state.prices[i];if(type==='sell'){if(!state.shares[i])return toast('보유 주식이 없습니다.');state.cash+=state.shares[i]*p;state.shares[i]=0;}else{const budget=type==='allbuy'?state.cash:Number($('#budget').value);if(!Number.isFinite(budget)||budget<=0)return toast('0보다 큰 예산을 입력하세요.');if(budget>state.cash+.001)return toast('현금보다 큰 예산입니다.');const n=Math.floor((budget+.000001)/p);if(!n)return toast('한 주를 살 수 있는 예산이 필요합니다.');state.shares[i]+=n;state.cash-=n*p;}render();toast('거래가 반영되었습니다.');}
function closeDay(){if(state.day>=5)return;const start=state.cash+state.shares.reduce((a,n,i)=>a+n*state.prices[i],0),rates=returns[state.day],weights=state.shares.map((n,i)=>n*state.prices[i]/start),profits=state.shares.map((n,i)=>n*state.prices[i]*rates[i]);state.prices=state.prices.map((p,i)=>p*(1+rates[i]));const total=state.cash+state.shares.reduce((a,n,i)=>a+n*state.prices[i],0);state.history.push({day:state.day+1,rates,weights,profits,cashWeight:state.cash/start,total,return:total/start-1,prices:[...state.prices]});state.day++;state.reviewDay=state.day;render();}

case 0:return `<h3>① 무엇을 더 중요하게 생각하나요?</h3><p>같은 점수표라도 중요하게 생각하는 기준에 따라 선택은 달라질 수 있습니다.</p>${productTable()}<div class="checkpoint">무게 가중치 x + 크기 가중치 y = 1<br>0 ≤ x ≤ 1, y = 1 − x</div><label for="weight">무게 가중치 x = <b id="x-label">${state.x.toFixed(2)}</b></label><input id="weight" type="range" min="0" max="1" step=".01" value="${state.x}"><div class="row between"><span>← 크기 중시</span><span>무게 중시 →</span></div><p>크기 가중치 y = <b id="y-label">${(1-state.x).toFixed(2)}</b></p>${note('weight-reason','내가 이 가중치를 정한 이유는?')}<button data-math-check="0">가중치 정하기 완료</button>`;
case 1:return `<h3>② 종합점수를 행렬로 만들어 보세요</h3>${productTable()}<p>점수 행렬과 가중치 열행렬을 곱한 뒤, <var>a</var><var>x</var> + <var>b</var> 꼴로 정리하세요. 빈칸에는 음수도 입력할 수 있습니다.</p><div class="matrix-tasks">${products.map((p,i)=>`<section class="checkpoint matrix-question" aria-label="노트북 ${labels[i]} 행렬 문제"><h4>노트북 ${labels[i]}</h4><div class="matrix-equation"><span class="math-matrix matrix-row" aria-label="1행 2열 점수 행렬">${mathInput(`m${i}0`,`${labels[i]} 무게 만족도`)}${mathInput(`m${i}1`,`${labels[i]} 크기 만족도`)}</span><span class="math-operator">×</span><span class="math-matrix matrix-column" aria-label="2행 1열 가중치 행렬"><span><var>x</var></span><span>1 − <var>x</var></span></span></div><div class="matrix-result"><span class="math-operator">=</span><span class="matrix-polynomial">${mathInput(`m${i}2`,`${labels[i]} x의 계수`)}<var>x</var><span>+</span>${mathInput(`m${i}3`,`${labels[i]} 상수항`)}</span></div><div class="row matrix-check-row"><button data-matrix-check="${i}" class="outline">정답 확인</button><div id="matrix-verdict-${i}" class="matrix-verdict" role="status">${matrixVerdict(i)}</div></div></section>`).join('')}</div><div class="row"><button id="fill-matrix-answers" class="outline">정답 전체 채우기</button><button data-math-check="1">전체 정답 확인</button></div>`;
case 2:return `<h3>③ 가중치별 종합점수를 계산해 보세요</h3><p>x에 0, 0.1, …, 1을 넣어 점수표를 완성하세요. 직접 계산하거나 각 행의 계산 버튼으로 네 제품의 점수를 한꺼번에 구할 수 있습니다.</p><div class="checkpoint">A = 5x + 5　 B = 2x + 6<br>C = 9 − 3x　 D = 10 − 7x</div><div class="scroll"><table class="score-input-table"><thead><tr><th>x</th>${labels.map(l=>`<th>노트북 ${l}</th>`).join('')}<th>한꺼번에 계산</th></tr></thead><tbody>${Array.from({length:11},(_,r)=>`<tr><td>${(r/10).toFixed(1)}</td>${labels.map((l,i)=>`<td>${mathInput(`t${r}-${i}`,`x=${(r/10).toFixed(1)}, 노트북 ${l} 점수`)}</td>`).join('')}<td><button class="outline row-calculate" data-calculate-row="${r}" aria-label="가중치 ${(r/10).toFixed(1)}의 네 제품 점수 계산">이 행 계산</button></td></tr>`).join('')}</tbody></table></div><button data-math-check="2" style="margin-top:16px">점수표 확인</button>`;
case 3:return `<h3>④ 표의 값을 좌표평면에 옮겨 보세요</h3><p>각 제품에서 x = 0, 0.5, 1인 세 점을 찍습니다. 직접 입력한 점이 모이면 제품별 직선이 나타납니다.</p><section class="plot-reference" aria-labelledby="plot-reference-title"><h4 id="plot-reference-title">내가 완성한 표</h4><div class="scroll"><table><thead><tr><th>x</th>${labels.map(l=>`<th>${l}</th>`).join('')}</tr></thead><tbody>${[0,5,10].map(r=>`<tr><td>${r/10}</td>${labels.map((_,i)=>`<td>${esc(m.answers[`t${r}-${i}`])}</td>`).join('')}</tr>`).join('')}</tbody></table></div></section><div id="student-plot">${mathGraph(true)}</div>${mathLegend()}<div class="row" style="margin-top:20px"><label>제품 <select id="plot-product">${labels.map((l,i)=>`<option value="${i}">${l}</option>`).join('')}</select></label><label>x <select id="plot-x"><option>0</option><option>0.5</option><option>1</option></select></label><label>점수 <input id="plot-y" type="number" step="any" aria-label="찍을 점의 종합점수"></label><button id="add-math-point">점 찍기</button></div><p id="point-count">${Object.keys(m.points).length} / 12개 점 완료</p>`;
case 4:return `<h3>⑤ 선택에서 제외할 수 있는 제품은?</h3>${mathGraph()}${mathLegend()}<p>어떤 x에서도 종합점수가 가장 높아지지 않는 제품을 찾아보세요.</p><label>제외할 제품 <select id="excluded" data-math-answer="excluded"><option value="">선택하세요</option>${labels.map(l=>`<option ${m.answers.excluded===l?'selected':''}>${l}</option>`).join('')}</select></label>${note('exclude-reason','그래프에서 어떤 점을 보고 판단했나요?')}<button data-math-check="4">선택 확인</button>`;
case 5:return `<h3>⑥ 어떤 가중치에서 어떤 제품이 최선일까요?</h3>${mathGraph()}${mathLegend()}<p>해당 제품의 점수가 나머지 제품의 점수 이상이 되도록 부등식을 세우고, 조건을 동시에 만족하는 x의 범위를 구하세요.</p><div class="checkpoint"><b>A가 최선일 조건</b><br>5x + 5 ≥ 2x + 6<br>5x + 5 ≥ 9 − 3x<br>5x + 5 ≥ 10 − 7x<br>0 ≤ x ≤ 1</div><details><summary>C와 D의 비교 부등식 보기</summary><p>C: 9 − 3x ≥ 5x + 5, 9 − 3x ≥ 2x + 6, 9 − 3x ≥ 10 − 7x<br>D: 10 − 7x ≥ 5x + 5, 10 − 7x ≥ 2x + 6, 10 − 7x ≥ 9 − 3x</p></details><div class="range-tasks">${['A','C','D'].map(l=>`<p><b>노트북 ${l}</b> ${mathInput(`r${l}0`,`${l} 최소 가중치`,'min="0" max="1"')} ≤ x ≤ ${mathInput(`r${l}1`,`${l} 최대 가중치`,'min="0" max="1"')}</p>`).join('')}</div><button data-math-check="5">선택 범위 확인</button>${note('matrix','가중치에 따라 추천이 바뀌는 이유를 설명해 보세요.')}`;
}}
function lesson2(){const m=mathState();m.step=Math.min(m.step,mathUnlocked());const step=m.step;return `<div class="math-steps" role="group" aria-label="행렬과 선택 활동 단계">${mathSteps.map((label,i)=>`<button data-math-step="${i}" class="${i===step?'selected':''}" aria-pressed="${i===step}" ${i>mathUnlocked()?'disabled':''}><span>${m.done[i]?'✓':i+1}</span>${label}</button>`).join('')}</div><section class="card math-activity"><div class="row between"><span class="pill">활동 ${step+1} / 6</span><span class="muted">${m.done.filter(Boolean).length}개 활동 완료</span></div><div style="margin-top:18px">${mathActivity(step)}</div><div class="row fill-all-row">${step!==1?`<button id="fill-math-activity" class="outline">${step===0?'예시 답안 채우기':'정답 전체 채우기'}</button>`:''}</div><div id="math-feedback" role="status">${m.done[step]?'<div class="feedback">이 활동을 완료했습니다. 다음 단계로 이동할 수 있습니다.</div>':''}</div><div class="row between math-navigation"><button class="outline" data-math-step="${step-1}" ${step===0?'disabled':''}>← 이전 활동</button>${step<5?`<button id="math-next" class="orange" data-math-step="${step+1}" ${!m.done[step]?'disabled':''}>다음 활동 →</button>`:`<button class="orange" data-tab="2" ${!m.done[5]?'disabled':''}>3차시 · 가중치 추정으로 →</button>`}</div></section>`;}
function italicizeVariables(root){const walker=document.createTreeWalker(root,NodeFilter.SHOW_TEXT),nodes=[];while(walker.nextNode())nodes.push(walker.currentNode);for(const node of nodes){if(node.parentElement.closest('var,textarea,input,select,svg,script,style'))continue;const text=node.textContent,re=/(?<![A-Za-z])[xy](?![A-Za-z])/g;if(!re.test(text))continue;re.lastIndex=0;const fragment=document.createDocumentFragment();let last=0;for(const match of text.matchAll(re)){fragment.append(text.slice(last,match.index));const variable=document.createElement('var');variable.textContent=match[0];fragment.append(variable);last=match.index+1;}fragment.append(text.slice(last));node.replaceWith(fragment);}const glyphs={a:'𝑎',b:'𝑏',x:'𝑥',y:'𝑦'};root.querySelectorAll('var').forEach(el=>{const key=el.textContent;if(glyphs[key]){el.setAttribute('aria-label',key);el.textContent=glyphs[key];}});}
function matrixCorrect(i){const answers=mathState().answers,[a,b]=products[i];return [a,b,a-b,b].every((v,j)=>String(answers[`m${i}${j}`]??'').trim()!==''&&Number.isFinite(Number(answers[`m${i}${j}`]))&&Math.abs(Number(answers[`m${i}${j}`])-v)<1e-7);}
function matrixVerdict(i){const grade=mathState().grades?.[i];return grade===true?'<span class="verdict-correct">✓ 정답입니다.</span>':grade===false?'<span class="verdict-wrong">✕ 오답입니다. 표시된 칸을 다시 확인하세요.</span>':'<span class="muted">답을 입력한 뒤 확인하세요.</span>';}
function checkMatrix(i){const m=mathState(),[a,b]=products[i];m.grades??={};m.grades[i]=matrixCorrect(i);[a,b,a-b,b].forEach((v,j)=>{const el=$(`[data-math-answer="m${i}${j}"]`),ok=el.value.trim()!==''&&Math.abs(Number(el.value)-v)<1e-7;el.classList.toggle('answer-error',!ok);el.classList.toggle('answer-correct',ok);el.setAttribute('aria-invalid',String(!ok));});$(`#matrix-verdict-${i}`).innerHTML=matrixVerdict(i);if(products.every((_,n)=>m.grades[n]===true&&matrixCorrect(n))){m.done[1]=true;$('#math-next').disabled=false;mathFeedback(true,'정답입니다! 네 제품의 행렬과 식을 모두 완성했습니다. 다음 활동으로 이동하세요.');document.querySelectorAll('.math-steps [data-math-step]').forEach(el=>el.disabled=Number(el.dataset.mathStep)>mathUnlocked());}save();}
function mathFeedback(ok,message){$('#math-feedback').innerHTML=`<div class="${ok?'feedback':'notice'}"><b>${mathState().step===0?'✓ 확인 완료':ok?'✓ 정답':'✕ 오답'}</b> · ${message}</div>`;}
function checkMath(step){const m=mathState(),a=m.answers,valid=(key,value)=>a[key]!==undefined&&String(a[key]).trim()!==''&&Number.isFinite(Number(a[key]))&&Math.abs(Number(a[key])-value)<1e-7;let errors=[];
if(step===1)products.forEach(([v,w],i)=>[v,w,v-w,w].forEach((n,j)=>{if(!valid(`m${i}${j}`,n))errors.push(`m${i}${j}`);}));
if(step===2)for(let r=0;r<=10;r++)scores(r/10).forEach((n,i)=>{if(!valid(`t${r}-${i}`,n))errors.push(`t${r}-${i}`);});
if(step===4&&a.excluded!=='B')errors.push('excluded');
if(step===5)Object.entries({A:[.5,1],C:[.25,.5],D:[0,.25]}).forEach(([l,vals])=>vals.forEach((n,i)=>{if(!valid(`r${l}${i}`,n))errors.push(`r${l}${i}`);}));
if(step===1){m.grades??={};products.forEach((_,i)=>{m.grades[i]=matrixCorrect(i);$(`#matrix-verdict-${i}`).innerHTML=matrixVerdict(i);});save();}
if(errors.length){document.querySelectorAll('[data-math-answer]').forEach(el=>{const bad=errors.includes(el.dataset.mathAnswer);el.classList.toggle('answer-error',bad);el.classList.toggle('answer-correct',!bad);el.setAttribute('aria-invalid',String(bad));});mathFeedback(false,step===4?'그래프에서 각 제품이 가장 높은 점수를 갖는 구간이 있는지 살펴보세요.':`아직 확인이 필요한 칸이 ${errors.length}개 있습니다. 표시된 칸을 다시 계산해 보세요.`);return;}
m.done[step]=true;render();mathFeedback(true,step===5?'탐구 완료! 경계 x = 0.25, 0.5에서는 두 제품이 공동 추천됩니다. 이제 내가 구한 범위가 선택과 어떻게 연결되는지 설명해 보세요.':step===4?'맞아요. B는 다른 제품보다 가장 높은 점수를 갖는 구간이 없습니다. 다음 활동에서 선택 범위를 부등식으로 확인합니다.':'확인했습니다! 다음 활동으로 이동해 보세요.');}
function fillMathActivity(){const m=mathState(),step=m.step;if(step===0){state.notes['weight-reason']=`나는 무게 가중치를 ${state.x.toFixed(2)}, 크기 가중치를 ${(1-state.x).toFixed(2)}로 정했다. 두 가중치의 합이 1이 되도록 나의 선호를 표현했다.`;}if(step===2)for(let r=0;r<=10;r++)scores(r/10).forEach((v,i)=>m.answers[`t${r}-${i}`]=String(Number(v.toFixed(2))));if(step===3){products.forEach((_,i)=>[0,.5,1].forEach(x=>m.points[`${i}-${x}`]=true));m.done[3]=true;}if(step===4){m.answers.excluded='B';state.notes['exclude-reason']='B의 그래프는 가중치가 0부터 1까지 변하는 동안 가장 위에 오는 구간이 없으므로 최선의 선택이 될 수 없다.';}if(step===5){Object.entries({A:[.5,1],C:[.25,.5],D:[0,.25]}).forEach(([l,vs])=>vs.forEach((v,i)=>m.answers[`r${l}${i}`]=String(v)));state.notes.matrix='가중치는 제품의 특성을 얼마나 중요하게 반영할지를 나타낸다. 각 제품의 종합점수는 가중치에 대한 일차식이며, 가중치가 변하면 점수의 대소 관계와 추천이 달라진다. 경계에서는 두 제품이 공동 추천된다.';}if(step!==3)for(let i=step;i<6;i++)m.done[i]=false;render();$('#math-feedback').innerHTML='<div class="feedback">'+(step===0?'예시 답안을 채웠습니다. 자신의 생각에 맞게 수정하세요.':step===3?'12개 점을 모두 채웠습니다. 다음 활동으로 이동할 수 있습니다.':'이 활동의 정답을 모두 채웠습니다. 정답 확인 버튼으로 확인하세요.')+'</div>';}
function fillCohort(c){state.est[c]=cohorts[c].map(s=>s.x);state.guess[c]=state.est[c][state.cursor[c]];state.notes['estimate'+c]='여섯 쌍의 선택을 모두 설명하는 가중치가 여러 개일 수 있으므로, 선택만으로 실제 가중치를 하나로 확정할 수 없다. 여기서는 여섯 선택을 설명할 수 있는 값을 추정한다.';}
function fillToolbar(){const example=state.tab!==1||mathState().step===0;return `<section class="fill-toolbar" aria-label="전체 답안 채우기"><div><strong>답안 한 번에 채우기</strong><p>${example?'이 활동은 정답이 하나가 아니므로 예시 답안을 채웁니다.':'현재 활동의 모든 빈칸에 정답을 채웁니다.'}</p></div><button id="fill-current-activity" class="orange">정답 전체 채우기</button><div id="fill-toolbar-status" role="status"></div></section>`;}
function fillCurrentActivity(){if(state.tab===1){if(mathState().step===1)mathClick({id:'fill-matrix-answers',dataset:{}});else fillMathActivity();return;}if(state.tab===2){fillCohort(0);render();$('#fill-toolbar-status').textContent='1반 학생 25명의 추정값 예시를 모두 채웠습니다.';return;}if(state.tab===3){if(class2Open)fillCohort(1);else{fillCohort(0);fillCohort(1);state.notes.compare='집단의 선호 분포에 따라 추정 가중치의 평균과 추천이 달라질 수 있다. 학급 평균 하나로 모든 학생의 선호를 설명할 수는 없다.';state.notes.newdata='추천 대상 집단의 다양한 학생에게서 선호와 선택 데이터를 모아야 한다.';}render();$('#fill-toolbar-status').textContent='추정값과 마무리 질문의 예시 답안을 채웠습니다.';return;}state.notes.stock='선택 종목의 단순평균은 종목을 같은 비중으로 계산하지만 전체 자산 수익률은 실제 투자 금액의 비중과 현금 비중을 반영하므로 두 값은 달라질 수 있다.';render();$('#fill-toolbar-status').textContent=state.day===5?'5일차 마무리 질문의 예시 답안을 채웠습니다.':'마무리 질문의 예시 답안을 저장했습니다. 5일차 마감 후 표시됩니다. 투자 선택에는 정해진 정답이 없습니다.';}
function mathClick(b){const m=mathState();if(b.id==='fill-current-activity'){fillCurrentActivity();return true;}if(b.id==='fill-math-activity'){fillMathActivity();return true;}if(b.dataset.fillCohort!==undefined){fillCohort(Number(b.dataset.fillCohort));render();toast('25명의 추정값 예시를 채웠습니다. 유일한 정답은 아닙니다.');return true;}if(b.id==='fill-all-cohorts'){fillCohort(0);fillCohort(1);render();toast('두 반의 추정값 예시를 채웠습니다.');return true;}if(b.id==='fill-stock-note'){state.notes.stock='선택 종목의 단순평균은 각 종목을 같은 비중으로 계산하지만, 전체 자산 수익률은 실제로 투자한 금액의 비중을 반영한다. 또한 전체 자산에는 수익률이 0%인 현금도 포함되므로 두 수익률은 달라질 수 있다.';render();return true;}if(b.id==='fill-compare-notes'){state.notes.compare='두 반의 선호 분포가 다르면 추정 가중치의 평균과 추천이 달라질 수 있다. 학급 평균 하나로 모든 학생의 선호를 설명할 수 없으며, 추천기를 만든 집단과 다른 집단의 일치율을 비교해야 한다.';state.notes.newdata='추천 대상 학교의 다양한 학생에게서 무게·크기 선호와 실제 선택을 수집하고, 학년이나 사용 목적 등에 따른 차이도 살펴봐야 한다.';render();return true;}if(b.id==='fill-matrix-answers'){products.forEach(([a,c],i)=>[a,c,a-c,c].forEach((v,j)=>m.answers[`m${i}${j}`]=String(v)));m.grades={};for(let i=1;i<6;i++)m.done[i]=false;render();$('#math-feedback').innerHTML='<div class="feedback">네 제품의 정답을 모두 채웠습니다. 전체 정답 확인 버튼으로 확인하세요.</div>';return true;}if(b.dataset.calculateRow!==undefined){const row=Number(b.dataset.calculateRow);if(Number.isInteger(row)&&row>=0&&row<=10){scores(row/10).forEach((score,i)=>m.answers[`t${row}-${i}`]=String(Number(score.toFixed(2))));for(let i=2;i<6;i++)m.done[i]=false;render();$('#math-feedback').innerHTML=`<div class="feedback">가중치 <var>x</var> = ${(row/10).toFixed(1)}의 네 제품 점수를 계산했습니다. 전체 점수표를 완성한 뒤 정답을 확인하세요.</div>`;italicizeVariables($('#content'));}return true;}if(b.dataset.matrixCheck!==undefined){checkMatrix(Number(b.dataset.matrixCheck));return true;}if(b.dataset.mathStep!==undefined){const next=Number(b.dataset.mathStep);if(next>=0&&next<=mathUnlocked()){m.step=next;render();$('#content').scrollIntoView({block:'start',behavior:'smooth'});}return true;}if(b.dataset.mathCheck!==undefined){checkMath(Number(b.dataset.mathCheck));return true;}if(b.id==='add-math-point'){const i=Number($('#plot-product').value),x=Number($('#plot-x').value),raw=$('#plot-y').value;if(raw===''||!Number.isFinite(Number(raw))||Math.abs(Number(raw)-scores(x)[i])>1e-7){mathFeedback(false,'표에서 해당 제품의 점수를 다시 확인해 보세요. 가로축은 가중치, 세로축은 종합점수입니다.');return true;}m.points[`${i}-${x}`]=true;m.done[3]=Object.keys(m.points).length===12;const product=$('#plot-product').value,xValue=$('#plot-x').value;render();$('#plot-product').value=product;$('#plot-x').value=xValue;mathFeedback(true,m.done[3]?'12개 점을 모두 찍었습니다. 다음 활동에서 그래프를 비교해 보세요.':'점이 추가되었습니다. 다른 제품이나 x값을 골라 계속 찍어 보세요.');return true;}return false;}
function scorePlot(){return svgPlot(products.map(([a,b],i)=>({values:[b,a],color:colors[i]})),{min:0,max:10});}
function pairChoices(x){const s=scores(x);return PAIRS.map(([a,b])=>Math.abs(s[a]-s[b])<1e-8?'동점':s[a]>s[b]?labels[a]:labels[b]);}
function pairMatches(guess,actual){const predicted=pairChoices(guess),observed=pairChoices(actual);return predicted.reduce((n,v,i)=>n+(v===observed[i]?1:0),0);}
function pairTable(c){const idx=state.cursor[c],g=state.guess[c],student=cohorts[c][idx],actual=pairChoices(student.x),predicted=pairChoices(g);return `<table class="pair-table"><thead><tr><th>비교</th><th>학생의 선택</th><th>내 가중치의 예측</th></tr></thead><tbody>${PAIRS.map(([a,b],i)=>{const ok=predicted[i]===actual[i];return `<tr><td>${labels[a]} vs ${labels[b]}</td><td><b>${actual[i]}</b></td><td class="${ok?'good':'bad'}"><span aria-label="${ok?'일치':'불일치'}">${ok?'✓':'✕'}</span> ${predicted[i]}</td></tr>`;}).join('')}</tbody></table>`;}
function estimateView(c){const idx=state.cursor[c],g=state.guess[c],count=state.est[c].filter(v=>v!==null).length,m=mean(c),all=count===25;return `<div class="grid pair-layout"><div class="stack"><section class="card pair-simulator"><div class="row between"><span class="pill">${c+1}반 · ${idx+1}번 학생</span><span>선택 데이터 6개</span></div><h3 style="margin-top:18px">선택을 설명하는 가중치는 얼마일까?</h3><p class="muted">학생이 두 제품 중 고른 결과를 보고, 무게 가중치를 움직여 여섯 선택을 설명해 보세요.</p><div class="row between"><label for="guess">무게 가중치 <var>x</var></label><b id="guess-label">${g.toFixed(2)}</b></div><input id="guess" data-class="${c}" type="range" min="0" max="1" step=".01" value="${g}"><div class="row between"><small>0 · 크기 중시</small><small>0.5</small><small>1 · 무게 중시</small></div><div class="row between pair-caption"><span>크기 가중치 <span id="guess-complement">${(1-g).toFixed(2)}</span></span><strong id="pair-count" aria-live="polite">예측 일치 ${pairMatches(g,cohorts[c][idx].x)} / 6</strong></div><div id="pair-table">${pairTable(c)}</div><p class="muted pair-tie-note">두 점수가 같으면 ‘동점’으로 예측합니다. 학생의 선택도 동점일 때만 일치로 셉니다.</p><div class="row between"><button id="reset-guess" class="outline" data-class="${c}">가중치 초기화</button><button id="submit-guess" data-class="${c}">추정값 ${state.est[c][idx]===null?'저장':'수정'}</button></div><div id="guess-feedback" role="status"></div><div class="row between" style="margin-top:20px"><button class="outline" data-student="-1" data-class="${c}" ${idx===0?'disabled':''}>← 이전 학생</button><span>${idx+1} / 25</span><button class="outline" data-student="1" data-class="${c}" ${idx===24?'disabled':''}>다음 학생 →</button></div></section><section class="card">${note('estimate'+c,'여섯 선택을 모두 설명해도 실제 가중치를 하나로 확정할 수 있을까?')}</section></div><div class="stack"><section class="card"><div class="row between"><h3>25명의 선택과 추정 기록</h3><span class="pill">${count} / 25명 저장</span></div><p class="muted">학생 번호를 누르면 해당 학생의 여섯 선택을 보며 추정할 수 있습니다.</p><div class="student-picker" role="group" aria-label="학생 선택">${Array.from({length:25},(_,i)=>`<button data-pair-student="${i}" data-class="${c}" class="${i===idx?'selected':''}" aria-pressed="${i===idx}">${i+1}${state.est[c][i]!==null?' ✓':''}</button>`).join('')}</div><div class="progress"><div style="width:${count*4}%"></div></div><div class="row between"><span>추정값 평균</span><b class="metric">${m===null?'—':m.toFixed(3)}</b></div><button class="outline" data-fill-cohort="${c}" style="margin:14px 0">추정값 예시 전체 채우기</button><div class="scroll cohort-pair-scroll"><table class="cohort-pair-table"><thead><tr><th>학생</th>${PAIRS.map(([a,b])=>`<th>${labels[a]}${labels[b]}</th>`).join('')}<th>추정 <var>x</var></th><th>일치</th>${all?'<th>실제 <var>x</var></th>':''}</tr></thead><tbody>${cohorts[c].map((student,i)=>`<tr class="${i===idx?'current-student':''}"><td><button data-pair-student="${i}" data-class="${c}" class="student-row-button">${i+1}번</button></td>${pairChoices(student.x).map(choice=>`<td>${choice}</td>`).join('')}<td>${state.est[c][i]===null?'—':state.est[c][i].toFixed(2)}</td><td>${state.est[c][i]===null?'—':`${pairMatches(state.est[c][i],student.x)}/6`}</td>${all?`<td>${student.x.toFixed(2)}</td>`:''}</tr>`).join('')}</tbody></table></div>${all?`<div class="feedback">25명의 추정을 완료했습니다. 실제 가중치와의 평균 절대 차이는 ${(state.est[c].reduce((a,v,i)=>a+Math.abs(v-cohorts[c][i].x),0)/25).toFixed(3)}입니다. 여섯 선택이 같더라도 가중치는 여러 값일 수 있습니다.</div>${distribution(c)}`:'<p class="muted">25명의 추정값을 모두 저장하면 실제 가중치와 분포를 확인할 수 있습니다.</p>'}${c===0?'<button data-tab="3" class="orange" style="margin-top:16px">4차시 · 다른 반에 적용 →</button>':'<button id="back-compare" class="orange" style="margin-top:16px">학급 비교로 돌아가기</button>'}</section></div></div>`;}
let class2Open=false;
function accuracy(source,target){const m=mean(source);return m===null?null:cohorts[target].reduce((sum,s)=>sum+pairMatches(m,s.x),0);}
function distribution(c){const vals=state.est[c];return `<h4>${c+1}반 추정 가중치 분포</h4><svg viewBox="0 0 540 100" role="img" aria-label="25명의 추정 가중치 분포"><line x1="20" y1="75" x2="520" y2="75" stroke="#aab5cc"/>${vals.map((v,i)=>v===null?'':`<circle cx="${20+v*500}" cy="${20+(i%5)*11}" r="4" fill="${c===0?'#2f5fe0':'#8a3fd6'}"><title>${i+1}번: ${v.toFixed(2)}</title></circle>`).join('')}<text x="20" y="96" class="plotlabel">0 · 크기 중시</text><text x="520" y="96" text-anchor="end" class="plotlabel">1 · 무게 중시</text>${mean(c)!==null?`<line x1="${20+mean(c)*500}" x2="${20+mean(c)*500}" y1="8" y2="78" stroke="#d27814" stroke-width="3"><title>평균 ${mean(c).toFixed(3)}</title></line>`:''}</svg><small>주황선: 평균 · 점의 세로 위치는 겹침을 줄이기 위한 배치입니다.</small>`;}
function lesson4(){if(class2Open)return estimateView(1);const ready=state.est.map(a=>a.every(v=>v!==null));return `<div class="grid"><div class="stack"><section class="card"><h3>① 1반 가중치로 2반의 여섯 선택 예측하기</h3>${ready[0]?`<p>1반 평균 가중치 <b>${mean(0).toFixed(3)}</b>를 2반 학생 25명에게 적용합니다.</p><div class="metric">${accuracy(0,1)} / 150개 일치</div><p>선택 예측 일치율 <b>${pct(accuracy(0,1)/150)}</b></p><div class="matchgrid">${cohorts[1].map((s,i)=>{const matches=pairMatches(mean(0),s.x);return `<div class="match ${matches===6?'':'no'}">${i+1}번<br>${matches} / 6 일치</div>`;}).join('')}</div><details><summary>1반 평균 가중치의 비교별 예측 보기</summary><table><thead><tr><th>비교</th><th>예측</th></tr></thead><tbody>${pairChoices(mean(0)).map((choice,i)=>`<tr><td>${labels[PAIRS[i][0]]} vs ${labels[PAIRS[i][1]]}</td><td>${choice}</td></tr>`).join('')}</tbody></table></details>`:'<div class="notice">먼저 3차시에서 1반 학생 25명의 가중치를 추정해 주세요.</div><button data-tab="2">1반 추정으로 이동</button>'}<p class="muted">학생 25명 × 비교 6개 = 총 150개 선택을 비교합니다. 동점은 별도 선택으로 취급합니다.</p></section><section class="card"><h3>② 2반의 선택으로 다시 추정하기</h3><p>2반에서도 AB·AC·AD·BC·BD·CD 선택을 보고 학생별 가중치를 추정합니다.</p><button id="open-class2" ${!ready[0]?'disabled':''}>2반 추정 활동 ${ready[1]?'다시 보기':'시작'} →</button>${distribution(0)}${distribution(1)}</section></div><div class="stack"><section class="card"><h3>③ 두 가중치 모형 교차 비교</h3><button id="fill-all-cohorts" class="outline">두 반 추정값 예시 전체 채우기</button><p class="muted">각 학급에서 추정한 가중치의 평균으로 여섯 선택을 예측합니다.</p><div class="scroll"><table><thead><tr><th>모형의 데이터</th><th>1반 적용</th><th>2반 적용</th></tr></thead><tbody>${[0,1].map(c=>`<tr><td>${c+1}반</td>${[0,1].map(t=>`<td>${ready[c]?`${accuracy(c,t)} / 150<br>${pct(accuracy(c,t)/150)}`:'추정 미완료'}</td>`).join('')}</tr>`).join('')}</tbody></table></div><div class="notice">가중치를 추정한 학급에 다시 적용한 결과와 다른 학급에서의 결과를 구분하세요.</div><details><summary>가상 데이터 구성</summary><p>1반: 무게 중시 20명·크기 중시 5명<br>2반: 무게 중시 5명·크기 중시 20명</p><p>무게 중시는 <var>x</var> = 0.70~1.00, 크기 중시는 <var>x</var> = 0.00~0.30입니다. 학생의 여섯 선택은 동일한 숨겨진 가중치로 생성됩니다.</p></details></section><section class="card"><h3>④ 어떤 데이터로 추정했나요?</h3><button id="fill-compare-notes" class="outline">마무리 예시 답안 채우기</button>${note('compare','두 반에서 추정한 가중치와 선택 예측 결과가 같거나 달라진 이유는?')}${note('newdata','다른 학교에 적용하려면 어떤 데이터를 더 모아야 할까?')}<div class="feedback">선택 데이터로 가중치를 추정하는 단순화된 모형입니다. 여섯 선택을 모두 설명해도 가중치가 하나로 결정되지 않을 수 있으며, 학급 평균 하나로 모든 학생의 선호를 설명할 수는 없습니다.</div><button id="export-bottom" class="orange">탐구 기록 내려받기</button></section></div></div>`;}
$('#tabs').addEventListener('click',e=>{const b=e.target.closest('[data-tab]');if(b){state.tab=Number(b.dataset.tab);class2Open=false;render();}});
$('#content').addEventListener('input',e=>{const t=e.target;if(t.dataset.mathAnswer){const m=mathState();const matrixKey=t.dataset.mathAnswer.match(/^m([0-3])[0-3]$/);if(matrixKey){if(m.grades)delete m.grades[matrixKey[1]];const verdict=$(`#matrix-verdict-${matrixKey[1]}`);if(verdict)verdict.innerHTML=matrixVerdict(Number(matrixKey[1]));t.closest('.matrix-question').querySelectorAll('.math-input').forEach(el=>{el.classList.remove('answer-correct','answer-error');el.removeAttribute('aria-invalid');});}m.answers[t.dataset.mathAnswer]=t.value;for(let i=m.step;i<6;i++)m.done[i]=false;if($('#math-next'))$('#math-next').disabled=true;const finish=$('.math-navigation [data-tab]');if(finish)finish.disabled=true;document.querySelectorAll('.math-steps [data-math-step]').forEach(el=>el.disabled=Number(el.dataset.mathStep)>mathUnlocked());if($('#math-feedback'))$('#math-feedback').innerHTML='';t.classList.remove('answer-error');t.removeAttribute('aria-invalid');save();}if(t.dataset.note){state.notes[t.dataset.note]=t.value;save();}if(t.id==='weight'){state.x=Number(t.value);$('#x-label').textContent=state.x.toFixed(2);if($('#y-label'))$('#y-label').textContent=(1-state.x).toFixed(2);save();}if(t.id==='guess'){const c=Number(t.dataset.class);state.guess[c]=Number(t.value);$('#guess-label').textContent=state.guess[c].toFixed(2);$('#pair-table').innerHTML=pairTable(c);if($('#guess-feedback'))$('#guess-feedback').innerHTML='';$('#guess-complement').textContent=(1-state.guess[c]).toFixed(2);$('#pair-count').textContent=`예측 일치 ${pairMatches(state.guess[c],cohorts[c][state.cursor[c]].x)} / 6`;save();}});
