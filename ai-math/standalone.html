<body><header><span class="badge">AI × 공통수학</span><h1>선택의 수학 <small>AI 추천 탐구실</small></h1><button id="export" class="outline light">기록 내려받기</button><button id="reset" class="outline light">초기화</button></header>
<nav aria-label="차시 선택" id="tabs"></nav><main><div class="intro"><span id="eyebrow"></span><h2 id="title"></h2><p id="description"></p></div><div id="content"></div></main><footer>가상 데이터로 탐구하는 추천 모형 · 진행 기록은 이 브라우저에 저장됩니다. <span id="save-status" role="status"></span></footer><div id="toast" role="status" aria-live="polite"></div><script>'use strict';
const $ = s => document.querySelector(s);
const KEY='ai-math-inquiry-v1', INITIAL=10000000;
const labels=['A','B','C','D'], colors=['#2f5fe0','#8a3fd6','#14a06f','#d27814'];
const products=[[10,5],[8,6],[6,9],[3,10]];
const companies=['반도체 설계','메모리','반도체 장비','소재','전력 반도체','신생 팹리스','패키징','수출 기업','센서'];
const returns=[[.10,.05,-.05,-.10,-.03,-.50,.05,-.70,-.30],[-.04,.08,.03,.02,-.06,.15,.04,.12,-.02],[.03,-.08,.06,.12,.04,-.2,.02,-.15,.09],[.08,.02,-.04,.03,.10,.05,-.03,.06,.02],[-.02,.06,.08,-.05,.03,-.12,.07,.04,-.06]];
const news=[['AI 반도체 수요 증가 전망','해외 규제 논의… 수출 기업의 불확실성 확대'],['설비 투자 확대 계획 발표','급락 종목의 반등을 기대하는 시선과 우려 공존'],['신소재 개발 소식, 공급 확대 기대','수요 전망 하향… 메모리 업계 긴장'],['전력 효율 개선 기술에 관심 집중','공급망 안정화 소식… 기업별 영향은 다를까?'],['신규 기기 출시로 센서 수요 기대','이익 실현 매물 출회 가능성… 마지막 날의 선택']];
function fresh(){return {version:1,tab:0,x:.5,stock:0,day:0,cash:INITIAL,shares:Array(9).fill(0),prices:Array(9).fill(100000),history:[],est:[Array(25).fill(null),Array(25).fill(null)],cursor:[0,0],guess:[.5,.5],notes:{},matrixDone:false,rangeDone:false};}
let state=fresh();
try{const saved=JSON.parse(localStorage.getItem(KEY));if(saved?.version===1&&saved.est?.length===2&&saved.shares?.length===9)state={...state,...saved};}catch{ /* Storage can be unavailable. */ }
function save(){try{localStorage.setItem(KEY,JSON.stringify(state));$('#save-status').textContent='자동 저장됨';}catch{$('#save-status').textContent='저장 불가 · 기록 내려받기를 이용하세요.';}}
function toast(t){$('#toast').textContent=t;$('#toast').style.display='block';clearTimeout(toast.timer);toast.timer=setTimeout(()=>$('#toast').style.display='none',3200);}
const money=n=>(Math.round(n)||0).toLocaleString('ko-KR')+'원', pct=n=>(n*100).toFixed(2)+'%';
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const scores=x=>products.map(([a,b])=>a*x+b*(1-x));
function winners(x){const s=scores(x),m=Math.max(...s);return labels.filter((_,i)=>Math.abs(s[i]-m)<1e-8);}
function mean(c){const a=state.est[c].filter(v=>v!==null);return a.length?a.reduce((a,b)=>a+b,0)/a.length:null;}

function cohort(c){return Array.from({length:25},(_,i)=>{const j=(i*7+3)%25;const high=c===0?j<20:j>=20;const x=high?.70+((j*13+c*7)%31)/100:((j*11+c*3)%31)/100;return {x:Math.round(x*100)/100,choice:winners(x)};});}

function svgPlot(series,{min=0,max=10,xlabels=['0','0.25','0.5','0.75','1'],xlabel='무게 가중치 x',ylabel='종합점수'}={}){const w=600,h=310,l=55,r=25,t=28,b=48;const px=x=>l+x*(w-l-r),py=y=>h-b-(y-min)/(max-min)*(h-t-b);let s=`<svg viewBox="0 0 ${w} ${h}" role="img" aria-label="${esc(ylabel)} 그래프"><text x="${l}" y="16" class="plotlabel">${esc(ylabel)}</text>`;for(let i=0;i<=4;i++){const v=min+(max-min)*i/4;s+=`<line x1="${l}" y1="${py(v)}" x2="${w-r}" y2="${py(v)}" stroke="#d8deec"/><text x="${l-8}" y="${py(v)+4}" text-anchor="end" class="plotlabel">${Number(v.toFixed(1))}</text>`;}xlabels.forEach((v,i)=>s+=`<text x="${px(i/(xlabels.length-1||1))}" y="${h-26}" text-anchor="middle" class="plotlabel">${v}</text>`);for(const [i,line]of series.entries()){s+=`<polyline fill="none" stroke="${line.color||colors[i%4]}" stroke-width="3" points="${line.values.map((v,j)=>`${px(j/(line.values.length-1||1))},${py(v)}`).join(' ')}"/>`;}return s+`<text x="${w/2}" y="${h-3}" text-anchor="middle" class="plotlabel">${esc(xlabel)}</text></svg>`;}
function tradingPanel(){const i=state.stock,done=false;return `<section class="card"><div class="row between"><h3>${done?'5일간의 투자 완료':`${state.day+1}일차 · 아침 뉴스`}</h3><span class="pill">가상 투자 · 실제 시세 아님</span></div>${done?'<p>거래 기록과 전체 자산을 확인하고, 하루의 결과를 비중으로 설명해 보세요.</p>':`<details><summary>📰 오늘의 뉴스 읽기</summary><ul>${news[state.day].map(t=>`<li>${t}</li>`).join('')}</ul><p class="muted">뉴스는 결과를 보장하지 않습니다. 마감 후 예상 밖의 소식이 있을 수 있습니다.</p></details>`}<div class="stockgrid">${companies.map((c,j)=>`<button class="stock ${i===j?'selected':''}" data-stock="${j}">${String.fromCharCode(65+j)} 기업<small>${c}</small><small>보유 ${state.shares[j]}주</small></button>`).join('')}</div><h4>${String.fromCharCode(65+i)} 기업 거래</h4><p class="muted">종목 가격은 비공개이며, 아래 주문 금액으로 살 수 있는 정수 주식을 계산합니다. 수수료는 없습니다.</p><label for="budget">주문 예산</label> <input id="budget" type="number" min="0" step="100000" value="1000000" style="width:170px"> <span class="muted">원</span><div class="row" style="margin-top:12px"><button data-trade="buy" ${done?'disabled':''}>예산만큼 매수</button><button data-trade="allbuy" class="outline" ${done?'disabled':''}>전액 매수</button><button data-trade="sell" class="outline" ${done?'disabled':''}>보유 전량 매도</button></div><button id="close-day" class="orange" style="margin-top:18px;width:100%" ${done?'disabled':''}>${done?'5일차 마감 완료':'거래를 마치고 오늘 장 마감 →'}</button></section>`;}
function investmentDay(){const latest=Math.min(state.day+1,5);return Number.isInteger(state.reviewDay)&&state.reviewDay>=1&&state.reviewDay<=latest?state.reviewDay:latest;}
function daySteps(selected){return `<div class="day-steps" role="group" aria-label="투자 일차 선택">${Array.from({length:5},(_,i)=>{const day=i+1,complete=day<=state.day,available=complete||day===state.day+1;return `<button data-investment-day="${day}" class="${day===selected?'selected':''}" aria-pressed="${day===selected}" ${available?'':'disabled'}><b>${day}일차</b><small>${complete?'마감 기록':available?'거래하기':'진행 전'}</small></button>`;}).join('')}</div>`;}
function lesson1(){const selected=investmentDay(),h=state.history[selected-1],total=h?h.total:state.cash+state.shares.reduce((a,n,i)=>a+n*state.prices[i],0);return `${daySteps(selected)}<div class="grid"><div class="stack">${h?`<section class="card"><span class="pill">${selected}일차 · 마감 기록</span><h3 style="margin-top:16px">이날 선택한 종목과 투자 결과</h3><p>${h.weights.map((w,i)=>w>0?String.fromCharCode(65+i):null).filter(Boolean).join(' · ')||'매수한 종목 없음 · 현금 보유'}</p><p class="muted">마감 기록을 보고 있습니다. 다음 거래일에서 매수·매도를 계속할 수 있습니다.</p><div class="row">${selected>1?`<button class="outline" data-investment-day="${selected-1}">← ${selected-1}일차</button>`:''}${selected<Math.min(state.day+1,5)?`<button class="orange" data-investment-day="${selected+1}">${selected+1}일차 ${selected<state.day?'기록':'거래하기'} →</button>`:''}</div></section>`:tradingPanel()}<section class="card"><h3>1~5일차 자산 변화</h3>${state.history.length?svgPlot([{values:[100,...state.history.map(h=>h.total/INITIAL*100)],color:'#2f5fe0'}],{min:Math.min(70,...state.history.map(h=>h.total/INITIAL*100))-5,max:Math.max(110,...state.history.map(h=>h.total/INITIAL*100))+5,xlabels:['시작',...state.history.map((_,i)=>`${i+1}일`)],xlabel:'마감 시점',ylabel:'초기 자산 = 100'}):'<p class="muted">첫 장 마감 후 그래프가 나타납니다.</p>'}</section></div><div class="stack"><section class="card hero"><div class="label">${selected}일차 ${h?'마감':'현재'} 총자산</div><div class="metric">${money(total)}</div><p>초기 자금 ${money(INITIAL)} · ${selected}일차까지 누적 수익률 ${pct(total/INITIAL-1)}</p></section><section class="card" id="day-result"><h3>${selected}일차 · 선택 종목과 수익률</h3>${h?dailyResult(h):'<p class="muted">오늘 거래를 마치고 장 마감을 누르면 선택 종목의 수익률과 전체 자산 수익률이 나타납니다.</p>'}</section>${selected===5&&h?`<section class="card" id="investment-reflection"><span class="pill">5일차 · 마무리 질문</span>${note('stock','내가 선택한 종목들의 하루 수익률의 평균과 전체 자산의 하루 수익률은 왜 다를까?')}</section>`:''}</div></div>`;}
function dailyResult(h){const held=h.rates.map((rate,i)=>({rate,i})).filter(({i})=>h.weights[i]>0),average=held.length?held.reduce((sum,s)=>sum+s.rate,0)/held.length:null;const start=h.day===1?INITIAL:state.history[h.day-2].total;return `<div class="compare day-metrics"><div><div class="label">선택 종목 단순평균</div><div class="metric">${average===null?'—':pct(average)}</div><small>${held.length?held.map(({i})=>String.fromCharCode(65+i)).join(' · '):'보유 종목 없음'}</small></div><div><div class="label">전체 자산 하루 수익률</div><div class="metric">${pct(h.return)}</div><small>하루 손익 ${money(h.total-start)}</small></div></div><div class="scroll"><table><thead><tr><th>선택 종목</th><th>하루 수익률</th><th>투자 비중</th><th>내 손익</th></tr></thead><tbody>${held.map(({rate:r,i})=>`<tr><td>${String.fromCharCode(65+i)}</td><td class="${r>=0?'good':'bad'}">${r>=0?'+':''}${pct(r)}</td><td>${pct(h.weights[i])}</td><td>${money(h.profits[i])}</td></tr>`).join('')}<tr><td>현금</td><td>0.00%</td><td>${pct(h.cashWeight)}</td><td>0원</td></tr><tr class="total-row"><td>전체 자산</td><td>${pct(h.return)}</td><td>100.00%</td><td>${money(h.total-start)}</td></tr></tbody></table></div><p class="muted">${h.day}일차 시작 자산 ${money(start)} → 마감 자산 ${money(h.total)}</p>${h.day===1?'<div class="notice">장 마감 속보 · 수출 제한과 자금 조달 악재로 일부 기업 급락.</div>':''}`;}
function trade(type){if(state.day>=5)return;const i=state.stock,p=state.prices[i];if(type==='sell'){if(!state.shares[i])return toast('보유 주식이 없습니다.');state.cash+=state.shares[i]*p;state.shares[i]=0;}else{const budget=type==='allbuy'?state.cash:Number($('#budget').value);if(!Number.isFinite(budget)||budget<=0)return toast('0보다 큰 예산을 입력하세요.');if(budget>state.cash+.001)return toast('현금보다 큰 예산입니다.');const n=Math.floor((budget+.000001)/p);if(!n)return toast('한 주를 살 수 있는 예산이 필요합니다.');state.shares[i]+=n;state.cash-=n*p;}render();toast('거래가 반영되었습니다.');}
function closeDay(){if(state.day>=5)return;const start=state.cash+state.shares.reduce((a,n,i)=>a+n*state.prices[i],0),rates=returns[state.day],weights=state.shares.map((n,i)=>n*state.prices[i]/start),profits=state.shares.map((n,i)=>n*state.prices[i]*rates[i]);state.prices=state.prices.map((p,i)=>p*(1+rates[i]));const total=state.cash+state.shares.reduce((a,n,i)=>a+n*state.prices[i],0);state.history.push({day:state.day+1,rates,weights,profits,cashWeight:state.cash/start,total,return:total/start-1,prices:[...state.prices]});state.day++;state.reviewDay=state.day;render();}

case 3:return `<h3>④ 표의 값을 좌표평면에 옮겨 보세요</h3><p>각 제품에서 x = 0, 0.5, 1인 세 점을 찍습니다. 직접 입력한 점이 모이면 제품별 직선이 나타납니다.</p><section class="plot-reference" aria-labelledby="plot-reference-title"><h4 id="plot-reference-title">내가 완성한 표</h4><div class="scroll"><table><thead><tr><th>x</th>${labels.map(l=>`<th>${l}</th>`).join('')}</tr></thead><tbody>${[0,5,10].map(r=>`<tr><td>${r/10}</td>${labels.map((_,i)=>`<td>${esc(m.answers[`t${r}-${i}`])}</td>`).join('')}</tr>`).join('')}</tbody></table></div></section><div id="student-plot">${mathGraph(true)}</div>${mathLegend()}<div class="row" style="margin-top:20px"><label>제품 <select id="plot-product">${labels.map((l,i)=>`<option value="${i}">${l}</option>`).join('')}</select></label><label>x <select id="plot-x"><option>0</option><option>0.5</option><option>1</option></select></label><label>점수 <input id="plot-y" type="number" step="any" aria-label="찍을 점의 종합점수"></label><button id="add-math-point">점 찍기</button></div><p id="point-count">${Object.keys(m.points).length} / 12개 점 완료</p>`;

function lesson2(){const m=mathState();m.step=Math.min(m.step,mathUnlocked());const step=m.step;return `<div class="math-steps" role="group" aria-label="행렬과 선택 활동 단계">${mathSteps.map((label,i)=>`<button data-math-step="${i}" class="${i===step?'selected':''}" aria-pressed="${i===step}" ${i>mathUnlocked()?'disabled':''}><span>${m.done[i]?'✓':i+1}</span>${label}</button>`).join('')}</div><section class="card math-activity"><div class="row between"><span class="pill">활동 ${step+1} / 6</span><span class="muted">${m.done.filter(Boolean).length}개 활동 완료</span></div><div style="margin-top:18px">${mathActivity(step)}</div><div id="math-feedback" role="status">${m.done[step]?'<div class="feedback">이 활동을 완료했습니다. 다음 단계로 이동할 수 있습니다.</div>':''}</div><div class="row between math-navigation"><button class="outline" data-math-step="${step-1}" ${step===0?'disabled':''}>← 이전 활동</button>${step<5?`<button id="math-next" class="orange" data-math-step="${step+1}" ${!m.done[step]?'disabled':''}>다음 활동 →</button>`:`<button class="orange" data-tab="2" ${!m.done[5]?'disabled':''}>3차시 · 가중치 추정으로 →</button>`}</div></section>`;}
function italicizeVariables(root){const walker=document.createTreeWalker(root,NodeFilter.SHOW_TEXT),nodes=[];while(walker.nextNode())nodes.push(walker.currentNode);for(const node of nodes){if(node.parentElement.closest('var,textarea,input,select,svg,script,style'))continue;const text=node.textContent,re=/(?<![A-Za-z])[xy](?![A-Za-z])/g;if(!re.test(text))continue;re.lastIndex=0;const fragment=document.createDocumentFragment();let last=0;for(const match of text.matchAll(re)){fragment.append(text.slice(last,match.index));const variable=document.createElement('var');variable.textContent=match[0];fragment.append(variable);last=match.index+1;}fragment.append(text.slice(last));node.replaceWith(fragment);}const glyphs={a:'𝑎',b:'𝑏',x:'𝑥',y:'𝑦'};root.querySelectorAll('var').forEach(el=>{const key=el.textContent;if(glyphs[key]){el.setAttribute('aria-label',key);el.textContent=glyphs[key];}});}

function checkMatrix(i){const m=mathState(),[a,b]=products[i];m.grades??={};m.grades[i]=matrixCorrect(i);[a,b,a-b,b].forEach((v,j)=>{const el=$(`[data-math-answer="m${i}${j}"]`),ok=el.value.trim()!==''&&Math.abs(Number(el.value)-v)<1e-7;el.classList.toggle('answer-error',!ok);el.classList.toggle('answer-correct',ok);el.setAttribute('aria-invalid',String(!ok));});$(`#matrix-verdict-${i}`).innerHTML=matrixVerdict(i);if(products.every((_,n)=>m.grades[n]===true&&matrixCorrect(n))){m.done[1]=true;$('#math-next').disabled=false;mathFeedback(true,'정답입니다! 네 제품의 행렬과 식을 모두 완성했습니다. 다음 활동으로 이동하세요.');document.querySelectorAll('.math-steps [data-math-step]').forEach(el=>el.disabled=Number(el.dataset.mathStep)>mathUnlocked());}save();}

function checkMath(step){const m=mathState(),a=m.answers,valid=(key,value)=>a[key]!==undefined&&String(a[key]).trim()!==''&&Number.isFinite(Number(a[key]))&&Math.abs(Number(a[key])-value)<1e-7;let errors=[];
if(step===1)products.forEach(([v,w],i)=>[v,w,v-w,w].forEach((n,j)=>{if(!valid(`m${i}${j}`,n))errors.push(`m${i}${j}`);}));

function mathClick(b){const m=mathState();if(b.dataset.calculateRow!==undefined){const row=Number(b.dataset.calculateRow);if(Number.isInteger(row)&&row>=0&&row<=10){scores(row/10).forEach((score,i)=>m.answers[`t${row}-${i}`]=String(Number(score.toFixed(2))));for(let i=2;i<6;i++)m.done[i]=false;render();$('#math-feedback').innerHTML=`<div class="feedback">가중치 <var>x</var> = ${(row/10).toFixed(1)}의 네 제품 점수를 계산했습니다. 전체 점수표를 완성한 뒤 정답을 확인하세요.</div>`;italicizeVariables($('#content'));}return true;}if(b.dataset.matrixCheck!==undefined){checkMatrix(Number(b.dataset.matrixCheck));return true;}if(b.dataset.mathStep!==undefined){const next=Number(b.dataset.mathStep);if(next>=0&&next<=mathUnlocked()){m.step=next;render();$('#content').scrollIntoView({block:'start',behavior:'smooth'});}return true;}if(b.dataset.mathCheck!==undefined){checkMath(Number(b.dataset.mathCheck));return true;}if(b.id==='add-math-point'){const i=Number($('#plot-product').value),x=Number($('#plot-x').value),raw=$('#plot-y').value;if(raw===''||!Number.isFinite(Number(raw))||Math.abs(Number(raw)-scores(x)[i])>1e-7){mathFeedback(false,'표에서 해당 제품의 점수를 다시 확인해 보세요. 가로축은 가중치, 세로축은 종합점수입니다.');return true;}m.points[`${i}-${x}`]=true;m.done[3]=Object.keys(m.points).length===12;const product=$('#plot-product').value,xValue=$('#plot-x').value;render();$('#plot-product').value=product;$('#plot-x').value=xValue;mathFeedback(true,m.done[3]?'12개 점을 모두 찍었습니다. 다음 활동에서 그래프를 비교해 보세요.':'점이 추가되었습니다. 다른 제품이나 x값을 골라 계속 찍어 보세요.');return true;}return false;}

$('#content').addEventListener('input',e=>{const t=e.target;if(t.dataset.mathAnswer){const m=mathState();const matrixKey=t.dataset.mathAnswer.match(/^m([0-3])[0-3]$/);if(matrixKey){if(m.grades)delete m.grades[matrixKey[1]];const verdict=$(`#matrix-verdict-${matrixKey[1]}`);if(verdict)verdict.innerHTML=matrixVerdict(Number(matrixKey[1]));t.closest('.matrix-question').querySelectorAll('.math-input').forEach(el=>{el.classList.remove('answer-correct','answer-error');el.removeAttribute('aria-invalid');});}m.answers[t.dataset.mathAnswer]=t.value;for(let i=m.step;i<6;i++)m.done[i]=false;if($('#math-next'))$('#math-next').disabled=true;const finish=$('.math-navigation [data-tab]');if(finish)finish.disabled=true;document.querySelectorAll('.math-steps [data-math-step]').forEach(el=>el.disabled=Number(el.dataset.mathStep)>mathUnlocked());if($('#math-feedback'))$('#math-feedback').innerHTML='';t.classList.remove('answer-error');t.removeAttribute('aria-invalid');save();}if(t.dataset.note){state.notes[t.dataset.note]=t.value;save();}if(t.id==='weight'){state.x=Number(t.value);$('#x-label').textContent=state.x.toFixed(2);if($('#y-label'))$('#y-label').textContent=(1-state.x).toFixed(2);save();}if(t.id==='guess'){const c=Number(t.dataset.class);state.guess[c]=Number(t.value);$('#guess-label').textContent=state.guess[c].toFixed(2);$('#guess-cards').innerHTML=scoreCards(state.guess[c]);save();}});
$('#content').addEventListener('click',e=>{const b=e.target.closest('button');if(!b||b.disabled)return;
if(mathClick(b))return;
if(b.dataset.tab){state.tab=Number(b.dataset.tab);class2Open=false;render();}

if(b.dataset.trade)trade(b.dataset.trade);
if(b.id==='close-day')closeDay();
if(b.dataset.student){const c=Number(b.dataset.class);state.cursor[c]=Math.max(0,Math.min(24,state.cursor[c]+Number(b.dataset.student)));state.guess[c]=state.est[c][state.cursor[c]]??.5;render();}
if(b.id==='submit-guess'){const c=Number(b.dataset.class),i=state.cursor[c],g=state.guess[c];state.est[c][i]=g;render();const ok=cohorts[c][i].choice.some(l=>winners(g).includes(l));$('#guess-feedback').innerHTML=`<div class="${ok?'feedback':'notice'}">${ok?'✓ 이 추정값으로 학생의 선택을 설명할 수 있습니다.':'이 추정값의 추천과 학생의 선택이 다릅니다. 기록은 저장되었으며, 슬라이더를 움직여 수정할 수 있습니다.'} 다음 학생으로 이동해 탐구를 계속하세요.</div>`;}
if(b.id==='open-class2'){class2Open=true;render();}
if(b.id==='back-compare'){class2Open=false;render();}
if(b.id==='export-bottom')download();
});
function download(){const payload={...state,exportedAt:new Date().toISOString(),cohorts,summary:{meanWeights:[mean(0),mean(1)],agreementCounts:[[accuracy(0,0),accuracy(0,1)],[accuracy(1,0),accuracy(1,1)]]}};const blob=new Blob([JSON.stringify(payload,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='선택의수학_탐구기록.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);toast('탐구 기록을 내려받았습니다.');}
