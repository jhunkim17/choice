<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>선택의 수학 · AI 추천 탐구실</title><style>:root{--navy:#14214d;--orange:#ff7a3d;--blue:#2f5fe0;--green:#087854;--red:#b32e36;--ink:#151a2d;--sub:#566079;--line:#d8deec;--bg:#f2f5fb}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Pretendard,"Noto Sans KR","Malgun Gothic",sans-serif;font-size:17px;line-height:1.65}header{background:var(--navy);color:white;display:flex;gap:16px;align-items:center;padding:16px 28px;flex-wrap:wrap}h1{font-size:23px;margin:0;flex:1}h1 small{font-size:14px;opacity:.75;display:inline-block;margin-left:8px}.badge{background:var(--orange);color:#14214d;border-radius:8px;padding:4px 10px;font-weight:800;font-size:14px}nav{background:white;display:grid;grid-template-columns:repeat(4,1fr);gap:8px;padding:12px 28px;border-bottom:1px solid var(--line)}nav button{background:white;color:var(--sub);box-shadow:none;text-align:left;border:2px solid transparent;padding:12px}nav button.active{background:#fff1e8;border-color:#ffc5a8;color:#85320c}.number{display:inline-grid;place-items:center;border-radius:50%;width:32px;height:32px;background:#e6eaf4;margin-right:8px}.active .number{background:var(--orange);color:var(--navy)}main{max-width:1400px;margin:auto;padding:24px 28px 50px}.intro span{font-weight:800;color:#ad470f;font-size:14px;letter-spacing:.08em}h2{font-size:32px;margin:4px 0 8px;line-height:1.35}.intro p{color:var(--sub);margin:0 0 24px}.grid{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:22px;align-items:start}.stack{display:grid;gap:18px}.card{background:white;border:2px solid var(--line);border-radius:20px;padding:22px;min-width:0}.card h3{margin:0 0 12px;font-size:21px}.card h4{margin:16px 0 6px}.hero{background:linear-gradient(135deg,#14214d,#293d8e);color:white;border-color:transparent}.hero p{color:#dce3ff}.muted,small{color:var(--sub)}.hero small{color:#dce3ff}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.between{justify-content:space-between}.metric{font-size:34px;font-weight:850;line-height:1.3}.label{font-size:14px;font-weight:700}.pill{display:inline-block;background:#eaf0ff;color:#2549ae;border-radius:20px;padding:4px 12px;font-size:14px;font-weight:800}.good{color:var(--green)}.bad{color:var(--red)}button{font:inherit;font-weight:750;border:0;border-radius:12px;padding:10px 16px;background:var(--blue);color:white;cursor:pointer;transition:background .15s}button:hover{filter:brightness(.94)}button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid #e08a1e;outline-offset:3px}button:disabled{opacity:.4;cursor:not-allowed}button.orange{background:var(--orange);color:#38200b}.outline{background:white;color:var(--blue);border:2px solid #cbd8fa}.light{color:white;border-color:#7682ac;background:transparent;font-size:14px}input,textarea,select{font:inherit;color:var(--ink);padding:10px;border:2px solid var(--line);border-radius:10px;background:white;max-width:100%}input[type=range]{width:100%;accent-color:var(--blue);padding:0;min-height:32px}input[type=number]{width:95px}textarea{display:block;width:100%;resize:vertical;min-height:100px;margin:10px 0}.scroll{overflow:auto;max-width:100%}table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}th{font-size:14px;color:#2549ae;background:#eaf0ff;white-space:nowrap}td,th{padding:9px 8px;text-align:center;border-bottom:1px solid #e5e9f2}td:first-child{text-align:left;font-weight:700}.stockgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.stock{background:#f6f8fc;color:var(--ink);border:2px solid var(--line);text-align:left;padding:12px}.stock.selected{border-color:var(--blue);background:#eaf0ff}.stock small{display:block;font-size:12px}.notice{background:#fff6dd;border-left:5px solid #d78b1e;padding:13px 16px;border-radius:10px;margin:14px 0}.feedback{background:#e6f7f0;border-left:5px solid var(--green);padding:14px;border-radius:10px;margin-top:14px}.equation{font-size:21px;text-align:center;background:#f2f5fc;padding:16px;border-radius:14px;overflow:auto}.matrix{display:inline-grid;gap:4px;padding:8px 14px;border-left:3px solid var(--navy);border-right:3px solid var(--navy);vertical-align:middle;margin:8px}.matrix span{display:flex;gap:20px;justify-content:space-between}svg{width:100%;height:auto;display:block}.legend{display:flex;gap:15px;justify-content:center;flex-wrap:wrap;font-size:14px}.swatch{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px}.student{font-size:58px;text-align:center;margin:12px}.progress{height:9px;border-radius:9px;background:#e5eaf5;overflow:hidden;margin:12px 0}.progress div{height:100%;background:var(--orange)}.choices{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:12px 0}.choices div{text-align:center;padding:12px 4px;border-radius:12px;background:#f2f5fb}.choices .winner{background:#e6f7f0;box-shadow:inset 0 0 0 2px var(--green)}.compare{display:grid;grid-template-columns:1fr 1fr;gap:12px}.compare>div{border:2px solid var(--line);border-radius:15px;padding:16px}.matchgrid{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}.match{padding:8px;background:#e6f7f0;color:var(--green);border-radius:9px;text-align:center;font-size:13px}.match.no{background:#fdecea;color:var(--red)}details{margin-top:14px}summary{cursor:pointer;font-weight:750}footer{max-width:1400px;margin:auto;padding:18px 28px;font-size:13px;color:var(--sub)}#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--navy);color:white;padding:12px 24px;border-radius:12px;display:none;max-width:90%;z-index:20}.plotlabel{font-size:12px;fill:var(--sub)}.checkpoint{background:#f5f8ff;padding:14px;border-radius:12px;margin-top:12px}.formula-input{width:62px!important;padding:5px;text-align:center}.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)}@media(max-width:950px){.grid{grid-template-columns:1fr}nav{padding:8px;gap:2px}nav button{font-size:13px;padding:8px 4px}.number{display:block;margin:0 auto 4px}header{padding:14px}main{padding:20px 14px}h2{font-size:26px}.card{padding:17px}h1 small{display:block;margin:0}.compare{grid-template-columns:1fr}}@media print{header button,nav,button{display:none}body{background:white}.grid{display:block}.card{break-inside:avoid;margin-bottom:16px}footer{display:none}}
@media(max-width:600px){header{gap:10px}header .badge{font-size:12px}h1{flex:1 1 180px;font-size:21px}header button{flex:1}.number{display:grid}.matchgrid{gap:5px}.match{font-size:12px}}

<body><header><span class="badge">AI × 공통수학</span><h1>선택의 수학 <small>AI 추천 탐구실</small></h1><button id="export" class="outline light">기록 내려받기</button><button id="reset" class="outline light">초기화</button></header>
<nav aria-label="차시 선택" id="tabs"></nav><main><div class="intro"><span id="eyebrow"></span><h2 id="title"></h2><p id="description"></p></div><div id="content"></div></main><footer>가상 데이터로 탐구하는 추천 모형 · 진행 기록은 이 브라우저에 저장됩니다. <span id="save-status" role="status"></span></footer><div id="toast" role="status" aria-live="polite"></div><script>'use strict';
const $ = s => document.querySelector(s);
const KEY='ai-math-inquiry-v1', INITIAL=10000000;
const labels=['A','B','C','D'], colors=['#2f5fe0','#8a3fd6','#14a06f','#d27814'];
const products=[[10,5],[8,6],[6,9],[3,10]];
const companies=['반도체 설계','메모리','반도체 장비','소재','전력 반도체','신생 팹리스','패키징','수출 기업','센서'];
const returns=[[.10,.05,-.05,-.10,-.03,-.50,.05,-.70,-.30],[-.04,.08,.03,.02,-.06,.15,.04,.12,-.02],[.03,-.08,.06,.12,.04,-.2,.02,-.15,.09],[.08,.02,-.04,.03,.10,.05,-.03,.06,.02],[-.02,.06,.08,-.05,.03,-.12,.07,.04,-.06]];
const news=[['AI 반도체 수요 증가 전망','해외 규제 논의… 수출 기업의 불확실성 확대'],['설비 투자 확대 계획 발표','급락 종목의 반등을 기대하는 시선과 우려 공존'],['신소재 개발 소식, 공급 확대 기대','수요 전망 하향… 메모리 업계 긴장'],['전력 효율 개선 기술에 관심 집중','공급망 안정화 소식… 기업별 영향은 다를까?'],['신규 기기 출시로 센서 수요 기대','이익 실현 매물 출회 가능성… 마지막 날의 선택']];
function fresh(){return {version:1,tab:0,x:.5,stock:0,day:0,cash:INITIAL,shares:Array(9).fill(0),prices:Array(9).fill(100000),history:[],est:[Array(25).fill(null),Array(25).fill(null)],cursor:[0,0],guess:[.5,.5],notes:{},matrixDone:false,rangeDone:false};}
let state=fresh();
try{const saved=JSON.parse(localStorage.getItem(KEY));if(saved?.version===1&&saved.est?.length===2&&saved.shares?.length===9)state={...state,...saved};}catch{ /* Storage can be unavailable. */ }
function save(){try{localStorage.setItem(KEY,JSON.stringify(state));$('#save-status').textContent='자동 저장됨';}catch{$('#save-status').textContent='저장 불가 · 기록 내려받기를 이용하세요.';}}
function toast(t){$('#toast').textContent=t;$('#toast').style.display='block';clearTimeout(toast.timer);toast.timer=setTimeout(()=>$('#toast').style.display='none',3200);}
const money=n=>Math.round(n).toLocaleString('ko-KR')+'원', pct=n=>(n*100).toFixed(2)+'%';
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const scores=x=>products.map(([a,b])=>a*x+b*(1-x));
function winners(x){const s=scores(x),m=Math.max(...s);return labels.filter((_,i)=>Math.abs(s[i]-m)<1e-8);}
function mean(c){const a=state.est[c].filter(v=>v!==null);return a.length?a.reduce((a,b)=>a+b,0)/a.length:null;}
// Reproducible fictional cohorts: 20/5 preferences, in shuffled order.
function cohort(c){return Array.from({length:25},(_,i)=>{const j=(i*7+3)%25;const high=c===0?j<20:j>=20;const x=high?.70+((j*13+c*7)%31)/100:((j*11+c*3)%31)/100;return {x:Math.round(x*100)/100,choice:winners(x)};});}
const cohorts=[cohort(0),cohort(1)];
const titles=['같은 시장, 다른 수익률','나의 선호를 행렬로 표현하면?','선택을 보고 가중치를 추정하자','다른 반에도 잘 맞는 추천기일까?'];
const descriptions=['뉴스를 읽고 투자한 뒤, 자산에서 차지하는 비중이 결과에 미치는 영향을 탐구합니다.','무게와 크기의 중요도를 바꾸며 행렬·그래프·부등식을 연결합니다.','1반의 선택 데이터로 가중치를 추정하고, 대표 가중치를 만들어 봅니다.','1반과 2반의 데이터로 만든 추천기를 비교하고, 데이터의 중요성을 설명합니다.'];
function note(id,prompt){return `<h4>${prompt}</h4><label class="sr-only" for="note-${id}">${prompt}</label><textarea id="note-${id}" data-note="${id}" placeholder="관찰한 결과와 그 이유를 써 보세요.">${esc(state.notes[id]||'')}</textarea>`;}
function render(){ $('#tabs').innerHTML=titles.map((t,i)=>`<button data-tab="${i}" class="${state.tab===i?'active':''}" aria-current="${state.tab===i?'step':'false'}"><span class="number">${i+1}</span>${['투자와 비중','행렬과 선택','가중치 추정','데이터와 추천'][i]}</button>`).join('');$('#eyebrow').textContent=`LESSON 0${state.tab+1} · 예상 → 조작 → 확인 → 설명`;$('#title').textContent=titles[state.tab];$('#description').textContent=descriptions[state.tab];$('#content').innerHTML=[lesson1,lesson2,()=>estimateView(0),lesson4][state.tab]();save();}
function svgPlot(series,{min=0,max=10,xlabels=['0','0.25','0.5','0.75','1'],xlabel='무게 가중치 x',ylabel='종합점수'}={}){const w=600,h=310,l=55,r=25,t=28,b=48;const px=x=>l+x*(w-l-r),py=y=>h-b-(y-min)/(max-min)*(h-t-b);let s=`<svg viewBox="0 0 ${w} ${h}" role="img" aria-label="${esc(ylabel)} 그래프"><text x="${l}" y="16" class="plotlabel">${esc(ylabel)}</text>`;for(let i=0;i<=4;i++){const v=min+(max-min)*i/4;s+=`<line x1="${l}" y1="${py(v)}" x2="${w-r}" y2="${py(v)}" stroke="#d8deec"/><text x="${l-8}" y="${py(v)+4}" text-anchor="end" class="plotlabel">${Number(v.toFixed(1))}</text>`;}xlabels.forEach((v,i)=>s+=`<text x="${px(i/(xlabels.length-1||1))}" y="${h-26}" text-anchor="middle" class="plotlabel">${v}</text>`);for(const [i,line]of series.entries()){s+=`<polyline fill="none" stroke="${line.color||colors[i%4]}" stroke-width="3" points="${line.values.map((v,j)=>`${px(j/(line.values.length-1||1))},${py(v)}`).join(' ')}"/>`;}return s+`<text x="${w/2}" y="${h-3}" text-anchor="middle" class="plotlabel">${esc(xlabel)}</text></svg>`;}
function lesson1(){const total=state.cash+state.shares.reduce((a,n,i)=>a+n*state.prices[i],0),i=state.stock,done=state.day===5;return `<div class="grid"><div class="stack"><section class="card"><div class="row between"><h3>${done?'5일간의 투자 완료':`${state.day+1}일차 · 아침 뉴스`}</h3><span class="pill">가상 투자 · 실제 시세 아님</span></div>${done?'<p>거래 기록과 전체 자산을 확인하고, 하루의 결과를 비중으로 설명해 보세요.</p>':`<details><summary>📰 오늘의 뉴스 읽기</summary><ul>${news[state.day].map(t=>`<li>${t}</li>`).join('')}</ul><p class="muted">뉴스는 결과를 보장하지 않습니다. 마감 후 예상 밖의 소식이 있을 수 있습니다.</p></details>`}<div class="stockgrid">${companies.map((c,j)=>`<button class="stock ${i===j?'selected':''}" data-stock="${j}">${String.fromCharCode(65+j)} 기업<small>${c}</small><small>보유 ${state.shares[j]}주</small></button>`).join('')}</div><h4>${String.fromCharCode(65+i)} 기업 거래</h4><p class="muted">종목 가격은 비공개이며, 아래 주문 금액으로 살 수 있는 정수 주식을 계산합니다. 수수료는 없습니다.</p><label for="budget">주문 예산</label> <input id="budget" type="number" min="0" step="100000" value="1000000" style="width:170px"> <span class="muted">원</span><div class="row" style="margin-top:12px"><button data-trade="buy" ${done?'disabled':''}>예산만큼 매수</button><button data-trade="allbuy" class="outline" ${done?'disabled':''}>전액 매수</button><button data-trade="sell" class="outline" ${done?'disabled':''}>보유 전량 매도</button></div><button id="close-day" class="orange" style="margin-top:18px;width:100%" ${done?'disabled':''}>${done?'5일차 마감 완료':'거래를 마치고 오늘 장 마감 →'}</button></section><section class="card"><h3>자산 변화</h3>${state.history.length?svgPlot([{values:[100,...state.history.map(h=>h.total/INITIAL*100)],color:'#2f5fe0'}],{min:Math.min(70,...state.history.map(h=>h.total/INITIAL*100))-5,max:Math.max(110,...state.history.map(h=>h.total/INITIAL*100))+5,xlabels:['시작',...state.history.map((_,i)=>`${i+1}일`)],xlabel:'마감 시점',ylabel:'초기 자산 = 100'}):'<p class="muted">첫 장 마감 후 그래프가 나타납니다.</p>'}</section></div><div class="stack"><section class="card hero"><div class="label">현재 총자산</div><div class="metric">${money(total)}</div><p>초기 자금 ${money(INITIAL)} · 누적 수익률 ${pct(total/INITIAL-1)}</p><div class="row between"><span>현금 ${money(state.cash)}</span><span>${state.day} / 5일 마감</span></div></section><section class="card"><h3>마감 결과와 비중</h3>${state.history.length?dailyResult(state.history.at(-1)):'<p>마감 후 종목별 시황과 내 투자 비중을 공개합니다. 현금의 수익률은 0%입니다.</p>'}${note('stock','종목의 평균 수익률과 내 수익률은 왜 다를까?')}</section></div></div>`;}
function dailyResult(h){return `<span class="pill">${h.day}일차 하루 분석</span>${h.day===1?'<div class="notice">속보 · 수출 제한과 자금 조달 악재로 일부 기업 급락. 아침 뉴스와 결과가 다를 수 있습니다.</div>':''}<div class="scroll"><table><thead><tr><th>기업</th><th>시황</th><th>시작 비중</th><th>내 손익</th></tr></thead><tbody>${h.rates.map((r,i)=>`<tr><td>${String.fromCharCode(65+i)}</td><td class="${r>=0?'good':'bad'}">${r>=0?'+':''}${pct(r)}</td><td>${pct(h.weights[i])}</td><td>${money(h.profits[i])}</td></tr>`).join('')}<tr><td>현금</td><td>0%</td><td>${pct(h.cashWeight)}</td><td>0원</td></tr></tbody></table></div><p>종목 단순평균 <b>${pct(h.rates.reduce((a,b)=>a+b,0)/9)}</b><br>내 하루 수익률 <b>${pct(h.return)}</b></p><div class="equation">전체 수익률 = Σ (시작 비중 × 수익률)</div><small>오늘 거래를 마친 직후부터 마감까지의 비중으로 계산합니다. 5일 누적 수익률은 최종 자산으로 따로 계산합니다.</small><details><summary>가격·자산 기록 보기</summary><div class="scroll"><table><thead><tr><th>일차</th><th>A~I 종가 (원)</th><th>총자산</th></tr></thead><tbody>${state.history.map(h=>`<tr><td>${h.day}</td><td>${h.prices.map(p=>Math.round(p).toLocaleString()).join(' / ')}</td><td>${money(h.total)}</td></tr>`).join('')}</tbody></table></div></details>`;}
function trade(type){if(state.day>=5)return;const i=state.stock,p=state.prices[i];if(type==='sell'){if(!state.shares[i])return toast('보유 주식이 없습니다.');state.cash+=state.shares[i]*p;state.shares[i]=0;}else{const budget=type==='allbuy'?state.cash:Number($('#budget').value);if(!Number.isFinite(budget)||budget<=0)return toast('0보다 큰 예산을 입력하세요.');if(budget>state.cash+.001)return toast('현금보다 큰 예산입니다.');const n=Math.floor((budget+.000001)/p);if(!n)return toast('한 주를 살 수 있는 예산이 필요합니다.');state.shares[i]+=n;state.cash-=n*p;}render();toast('거래가 반영되었습니다.');}
function closeDay(){if(state.day>=5)return;const start=state.cash+state.shares.reduce((a,n,i)=>a+n*state.prices[i],0),rates=returns[state.day],weights=state.shares.map((n,i)=>n*state.prices[i]/start),profits=state.shares.map((n,i)=>n*state.prices[i]*rates[i]);state.prices=state.prices.map((p,i)=>p*(1+rates[i]));const total=state.cash+state.shares.reduce((a,n,i)=>a+n*state.prices[i],0);state.history.push({day:state.day+1,rates,weights,profits,cashWeight:state.cash/start,total,return:total/start-1,prices:[...state.prices]});state.day++;render();}
function scoreCards(x){const s=scores(x),win=winners(x);return `<div class="choices">${labels.map((l,i)=>`<div class="${win.includes(l)?'winner':''}"><b>${l}</b><br>${s[i].toFixed(2)}<br><small>${win.includes(l)?'★ 추천':'점'}</small></div>`).join('')}</div>`;}
function lesson2(){return `<div class="grid"><div class="stack"><section class="card"><h3>같은 제품, 다른 중요도</h3><table><thead><tr><th>만족도</th>${labels.map(l=>`<th>노트북 ${l}</th>`).join('')}</tr></thead><tbody><tr><td>가벼운 정도</td>${products.map(p=>`<td>${p[0]}</td>`).join('')}</tr><tr><td>크기</td>${products.map(p=>`<td>${p[1]}</td>`).join('')}</tr></tbody></table><p class="muted">점수가 클수록 해당 특성의 만족도가 높습니다.</p><label for="weight"><b>무게 가중치 x = <span id="x-label">${state.x.toFixed(2)}</span></b></label><input id="weight" type="range" min="0" max="1" step=".01" value="${state.x}"><div class="row between"><span>크기 중시 ←</span><span>→ 무게 중시</span></div><div id="score-cards">${scoreCards(state.x)}</div><div id="score-plot">${scorePlot()}</div><div class="legend">${labels.map((l,i)=>`<span><i class="swatch" style="background:${colors[i]}"></i>${l}</span>`).join('')}</div></section><section class="card"><h3>계산으로 그래프 확인하기</h3><details><summary>x = 0부터 1까지 점수표 보기</summary><div class="scroll"><table><thead><tr><th>x</th>${labels.map(l=>`<th>${l}</th>`).join('')}</tr></thead><tbody>${Array.from({length:11},(_,i)=>`<tr><td>${(i/10).toFixed(1)}</td>${scores(i/10).map(v=>`<td>${v.toFixed(1)}</td>`).join('')}</tr>`).join('')}</tbody></table></div></details><p>슬라이더를 움직여 순위가 바뀌는 위치를 먼저 예상한 뒤, 오른쪽 부등식 활동으로 확인하세요.</p></section></div><div class="stack"><section class="card"><h3>① 행렬로 종합점수 만들기</h3><div class="equation"><div class="matrix">${products.map(p=>`<span>${p[0]}　${p[1]}</span>`).join('')}</div> × <div class="matrix"><span>x</span><span>1 − x</span></div></div><p>노트북 A: 10x + 5(1 − x) = ax + b</p><label>a <input id="coeff-a" class="formula-input" type="number" aria-label="x의 계수 a"></label> <label>b <input id="coeff-b" class="formula-input" type="number" aria-label="상수항 b"></label> <button id="check-matrix">확인</button><div id="matrix-feedback" role="status">${state.matrixDone?'<p class="feedback">확인 완료 · A의 점수는 5x + 5입니다.</p>':''}</div><details><summary>네 제품의 식 확인</summary><p>A = 5x + 5<br>B = 2x + 6<br>C = 9 − 3x<br>D = 10 − 7x</p></details></section><section class="card"><h3>② 최선의 선택을 부등식으로</h3><p>A가 최선이려면 A ≥ B, A ≥ C, A ≥ D를 모두 만족해야 합니다.</p><div class="checkpoint">5x + 5 ≥ 2x + 6<br>5x + 5 ≥ 9 − 3x<br>5x + 5 ≥ 10 − 7x<br>0 ≤ x ≤ 1</div><p><label>A가 최선이 되는 최소 x <input id="threshold" type="number" min="0" max="1" step=".01"></label></p><label>최선이 될 수 없는 제품 <select id="excluded"><option value="">선택</option>${labels.map(l=>`<option>${l}</option>`).join('')}</select></label> <button id="check-range">확인</button><div id="range-feedback" role="status">${state.rangeDone?rangeAnswer():''}</div>${note('matrix','가중치에 따라 추천이 바뀌는 이유를 설명해 보세요.')}</section></div></div>`;}
function scorePlot(){return svgPlot(products.map(([a,b],i)=>({values:[b,a],color:colors[i]})),{min:0,max:10});}
function rangeAnswer(){return '<div class="feedback">정답 · A: 1/2 ≤ x ≤ 1, C: 1/4 ≤ x ≤ 1/2, D: 0 ≤ x ≤ 1/4. B는 최선인 구간이 없습니다. x = 1/4, 1/2에서는 공동 추천입니다.</div>';}
function estimateView(c){const idx=state.cursor[c],student=cohorts[c][idx],g=state.guess[c],count=state.est[c].filter(v=>v!==null).length,m=mean(c),all=count===25;return `<div class="grid"><div class="stack"><section class="card hero"><span class="badge">${c+1}반 데이터</span><h3 style="margin-top:16px">${c+1}반 ${idx+1}번 학생의 선택</h3><div class="student" aria-hidden="true">💻</div><div class="metric" style="text-align:center">노트북 ${student.choice.join(' · ')}</div><p>선택만 보고 무게 가중치를 추정해 보세요. 실제 가중치는 아직 숨겨져 있습니다.</p></section><section class="card"><h3>어떤 가중치로 설명할 수 있을까?</h3><label for="guess">추정한 무게 가중치 <b id="guess-label">${g.toFixed(2)}</b></label><input id="guess" data-class="${c}" type="range" min="0" max="1" step=".01" value="${g}"><div class="row between"><span>크기 중시</span><span>무게 중시</span></div><div id="guess-cards">${scoreCards(g)}</div><button id="submit-guess" data-class="${c}">추정값 ${state.est[c][idx]===null?'저장':'수정'}</button><div id="guess-feedback" role="status"></div><div class="row between" style="margin-top:20px"><button class="outline" data-student="-1" data-class="${c}" ${idx===0?'disabled':''}>← 이전 학생</button><span>${idx+1} / 25</span><button class="outline" data-student="1" data-class="${c}" ${idx===24?'disabled':''}>다음 학생 →</button></div><p class="muted">선택을 설명하는 값은 여러 개입니다. 추천이 같아도 실제 가중치와의 거리는 다를 수 있습니다.</p></section></div><div class="stack"><section class="card"><div class="row between"><h3>우리의 추정 기록</h3><span class="pill">${count} / 25명</span></div><div class="progress"><div style="width:${count*4}%"></div></div><p>추정값 평균 <b class="metric">${m===null?'—':m.toFixed(3)}</b></p><p>${all?`이 평균으로 추천하는 제품은 <b>${winners(m).join(' · ')}</b>입니다.`:'모든 학생을 추정하면 학급의 대표 추천기를 완성합니다.'}</p><div class="scroll" style="max-height:330px"><table><thead><tr><th>학생</th><th>선택</th><th>추정 x</th>${all?'<th>실제 x</th>':''}</tr></thead><tbody>${state.est[c].map((v,i)=>`<tr><td>${i+1}번</td><td>${cohorts[c][i].choice.join('·')}</td><td>${v===null?'미입력':v.toFixed(2)}</td>${all?`<td>${cohorts[c][i].x.toFixed(2)}</td>`:''}</tr>`).join('')}</tbody></table></div>${all?`<div class="feedback">추정 완료! 실제 가중치와 평균 절대 차이는 ${(state.est[c].reduce((a,v,i)=>a+Math.abs(v-cohorts[c][i].x),0)/25).toFixed(3)}입니다. 값의 차이와 선택 예측의 성공은 서로 다른 지표입니다.</div>${distribution(c)}`:''}${c===0?'<button data-tab="3" class="orange" style="margin-top:15px">4차시 · 다른 반에 적용 →</button>':'<button id="back-compare" class="orange" style="margin-top:15px">비교 결과로 돌아가기</button>'}</section><section class="card">${note('estimate'+c,'같은 선택을 보고도 서로 다른 가중치를 추정할 수 있는 이유는?')}</section></div></div>`;}
let class2Open=false;
function accuracy(source,target){const m=mean(source);if(m===null)return null;const predicted=winners(m);return cohorts[target].filter(s=>s.choice.some(l=>predicted.includes(l))).length;}
function distribution(c){const vals=state.est[c];return `<h4>${c+1}반 추정 가중치 분포</h4><svg viewBox="0 0 540 100" role="img" aria-label="25명의 추정 가중치 분포"><line x1="20" y1="75" x2="520" y2="75" stroke="#aab5cc"/>${vals.map((v,i)=>v===null?'':`<circle cx="${20+v*500}" cy="${20+(i%5)*11}" r="4" fill="${c===0?'#2f5fe0':'#8a3fd6'}"><title>${i+1}번: ${v.toFixed(2)}</title></circle>`).join('')}<text x="20" y="96" class="plotlabel">0 · 크기 중시</text><text x="520" y="96" text-anchor="end" class="plotlabel">1 · 무게 중시</text>${mean(c)!==null?`<line x1="${20+mean(c)*500}" x2="${20+mean(c)*500}" y1="8" y2="78" stroke="#d27814" stroke-width="3"><title>평균 ${mean(c).toFixed(3)}</title></line>`:''}</svg><small>주황선: 평균 · 점의 세로 위치는 겹침을 줄이기 위한 배치입니다.</small>`;}
function lesson4(){if(class2Open)return estimateView(1);const ready=state.est.map(a=>a.every(v=>v!==null));return `<div class="grid"><div class="stack"><section class="card"><h3>① 1반 추천기를 2반에 적용하기</h3>${ready[0]?`<p>1반 평균 가중치 <b>${mean(0).toFixed(3)}</b> → 노트북 <b>${winners(mean(0)).join(' · ')}</b> 추천</p><div class="metric">${accuracy(0,1)} / 25명 일치</div><p>추천 일치율 <b>${pct(accuracy(0,1)/25)}</b></p><div class="matchgrid">${cohorts[1].map((s,i)=>{const yes=s.choice.some(l=>winners(mean(0)).includes(l));return `<div class="match ${yes?'':'no'}">${i+1}번 ${yes?'✓':'×'}<br>선택 ${s.choice.join('·')}</div>`;}).join('')}</div>`:'<div class="notice">먼저 3차시에서 1반 학생 25명의 가중치를 추정해 주세요.</div><button data-tab="2">1반 추정으로 이동</button>'}<p class="muted">공동 추천 중 학생의 선택이 하나라도 포함되면 일치로 셉니다. 이 값은 25명의 관찰된 일치율입니다.</p></section><section class="card"><h3>② 2반 데이터로 다시 추정하기</h3><p>2반에도 같은 방법을 적용해 새로운 대표 가중치를 만듭니다.</p><button id="open-class2" ${!ready[0]?'disabled':''}>2반 추정 활동 ${ready[1]?'다시 보기':'시작'} →</button>${distribution(0)}${distribution(1)}</section></div><div class="stack"><section class="card"><h3>③ 추천기를 교차 비교하기</h3><div class="scroll"><table><thead><tr><th>추천기의 데이터</th><th>1반 적용</th><th>2반 적용</th></tr></thead><tbody>${[0,1].map(c=>`<tr><td>${c+1}반</td>${[0,1].map(t=>`<td>${ready[c]?`${accuracy(c,t)} / 25<br>${pct(accuracy(c,t)/25)}`:'추정 미완료'}</td>`).join('')}</tr>`).join('')}</tbody></table></div><div class="notice">다른 반에 적용한 결과가 새로운 집단에 대한 평가입니다. 추천기를 만든 반에 다시 적용한 결과와 구분하세요.</div><details><summary>가상 데이터의 구성 확인</summary><p>1반: 무게 중시 20명·크기 중시 5명<br>2반: 무게 중시 5명·크기 중시 20명</p><p>무게 중시 학생은 x = 0.70~1.00, 크기 중시 학생은 x = 0.00~0.30입니다. 같은 가상 데이터를 반복 사용하므로 추정 방식에 따른 차이를 비교할 수 있습니다.</p></details></section><section class="card"><h3>④ 데이터가 바뀌면 추천도 바뀔까?</h3>${note('compare','두 추천기의 결과가 같거나 달라진 이유는 무엇일까?')}${note('newdata','다른 학교 학생에게 추천하려면 어떤 데이터를 더 모아야 할까?')}<div class="feedback">이 활동은 선택 데이터에서 가중치를 추정해 추천하는 단순화된 모형입니다. 실제 AI 전체를 재현하지 않으며, 학급 평균 하나로 모든 학생의 선호를 설명할 수는 없습니다.</div><button id="export-bottom" class="orange">탐구 기록 내려받기</button></section></div></div>`;}
$('#tabs').addEventListener('click',e=>{const b=e.target.closest('[data-tab]');if(b){state.tab=Number(b.dataset.tab);class2Open=false;render();}});
$('#content').addEventListener('input',e=>{const t=e.target;if(t.dataset.note){state.notes[t.dataset.note]=t.value;save();}if(t.id==='weight'){state.x=Number(t.value);$('#x-label').textContent=state.x.toFixed(2);$('#score-cards').innerHTML=scoreCards(state.x);save();}if(t.id==='guess'){const c=Number(t.dataset.class);state.guess[c]=Number(t.value);$('#guess-label').textContent=state.guess[c].toFixed(2);$('#guess-cards').innerHTML=scoreCards(state.guess[c]);save();}});
$('#content').addEventListener('click',e=>{const b=e.target.closest('button');if(!b||b.disabled)return;
if(b.dataset.tab){state.tab=Number(b.dataset.tab);class2Open=false;render();}
if(b.dataset.stock!==undefined){state.stock=Number(b.dataset.stock);render();}
if(b.dataset.trade)trade(b.dataset.trade);
if(b.id==='close-day')closeDay();
if(b.id==='check-matrix'){const ok=$('#coeff-a').value!==''&&$('#coeff-b').value!==''&&Number($('#coeff-a').value)===5&&Number($('#coeff-b').value)===5;state.matrixDone=state.matrixDone||ok;$('#matrix-feedback').innerHTML=ok?'<p class="feedback">맞아요! A의 종합점수는 5x + 5입니다.</p>':'<p class="notice">5(1 − x)를 전개한 뒤 x항과 상수항을 각각 모아 보세요.</p>';save();}
if(b.id==='check-range'){const ok=$('#threshold').value!==''&&Math.abs(Number($('#threshold').value)-.5)<1e-8&&$('#excluded').value==='B';state.rangeDone=state.rangeDone||ok;$('#range-feedback').innerHTML=ok?rangeAnswer():'<div class="notice">A ≥ C에서 얻는 조건과 다른 부등식의 조건을 모두 비교해 보세요. 최선이 될 수 없는 제품은 그래프의 가장 위에 오는 구간이 없습니다.</div>';save();}
if(b.dataset.student){const c=Number(b.dataset.class);state.cursor[c]=Math.max(0,Math.min(24,state.cursor[c]+Number(b.dataset.student)));state.guess[c]=state.est[c][state.cursor[c]]??.5;render();}
if(b.id==='submit-guess'){const c=Number(b.dataset.class),i=state.cursor[c],g=state.guess[c];state.est[c][i]=g;render();const ok=cohorts[c][i].choice.some(l=>winners(g).includes(l));$('#guess-feedback').innerHTML=`<div class="${ok?'feedback':'notice'}">${ok?'✓ 이 추정값으로 학생의 선택을 설명할 수 있습니다.':'이 추정값의 추천과 학생의 선택이 다릅니다. 기록은 저장되었으며, 슬라이더를 움직여 수정할 수 있습니다.'} 다음 학생으로 이동해 탐구를 계속하세요.</div>`;}
if(b.id==='open-class2'){class2Open=true;render();}
if(b.id==='back-compare'){class2Open=false;render();}
if(b.id==='export-bottom')download();
});
function download(){const payload={...state,exportedAt:new Date().toISOString(),cohorts,summary:{meanWeights:[mean(0),mean(1)],agreementCounts:[[accuracy(0,0),accuracy(0,1)],[accuracy(1,0),accuracy(1,1)]]}};const blob=new Blob([JSON.stringify(payload,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='선택의수학_탐구기록.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);toast('탐구 기록을 내려받았습니다.');}
$('#export').onclick=download;
$('#reset').onclick=()=>{if(confirm('이 브라우저의 모든 탐구 기록을 초기화할까요? 필요한 기록은 먼저 내려받으세요.')){state=fresh();class2Open=false;render();toast('새 탐구를 시작합니다.');}};
render();
</script></body></html>
